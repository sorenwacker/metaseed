# Dependency update PRs. Alerts alone only tell you about a CVE; these PRs
# carry the fix through the same gated CI as any other change. Weekly and
# grouped, so updates arrive as one reviewable PR per ecosystem instead of a
# trickle that trains everyone to ignore them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
