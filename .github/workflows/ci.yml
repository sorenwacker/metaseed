name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy src/metaseed

      - name: Run tests with coverage
        # Exclude network-marked tests: they hit live third-party services
        # (e.g. the EBI/MetaboLights API), so an external outage would fail CI
        # for unrelated changes. This matches the project's pre-push hook.
        run: |
          uv run pytest \
            -m "not network" \
            --ignore=tests/test_ui/test_selenium.py \
            --ignore=tests/test_ui/test_spec_builder_selenium.py \
            --ignore=tests/test_ui/selenium/ \
            --cov=src/metaseed \
            --cov-report=xml \
            --cov-fail-under=78 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
