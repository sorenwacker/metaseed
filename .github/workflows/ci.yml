name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uv run ruff check .

      - name: Run tests with coverage
        # Exclude network-marked tests: they hit live third-party services
        # (e.g. the EBI/MetaboLights API), so an external outage would fail CI
        # for unrelated changes. This matches the project's pre-push hook.
        run: |
          uv run pytest \
            -m "not network" \
            --ignore=tests/test_ui/test_selenium.py \
            --ignore=tests/test_ui/test_spec_builder_selenium.py \
            --ignore=tests/test_ui/selenium/ \
            --cov=src/metaseed \
            --cov-report=xml \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
