name: CI

on:
  # Pull requests run the fast gate (lint, format, types, and the non-selenium,
  # non-network tests). Releases keep the heavier work: the release workflow runs
  # the same suite plus selenium, the dependency audit and a fresh-resolution
  # install smoke test before publishing. Routine pushes to a branch still cost
  # nothing -- the local pre-push hook runs the same suite.
  #
  # PRs are triggered deliberately: branch protection requires the `test`
  # context, and before this it could never report, because the workflow ran
  # only on tags where the job skips itself.
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same ref, so
# repeated pushes to a PR don't stack up parallel full runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # On a version tag the release workflow already runs the pytest gate before
    # publishing, so skip this duplicate there. This job still runs on manual
    # dispatch (its full lint/format/mypy/coverage gate).
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # dcat (rdflib) is needed so mypy sees real types for dcat/serialize.py;
        # the other extras are just httpx, already pulled in by dev.
        run: uv sync --extra dev --extra dcat

      - name: Run linting
        run: uv run ruff check .

      - name: Check formatting
        # Gate formatting in CI, not only in the pre-commit hook. Without this,
        # drift is invisible to anyone who commits without the hook installed --
        # which is how main reached 18 non-compliant files before #147.
        run: uv run ruff format --check .

      - name: Run type checking
        run: uv run mypy src/metaseed

      - name: Run tests with coverage
        # Exclude network-marked tests: they hit live third-party services
        # (e.g. the EBI/MetaboLights API), so an external outage would fail CI
        # for unrelated changes. Exclude selenium-marked tests: they drive a real
        # browser and run in the dedicated `selenium` job below. This matches the
        # project's pre-push hook.
        run: |
          uv run pytest \
            -m "not selenium and not network" \
            --cov=src/metaseed \
            --cov-report=xml \
            --cov-fail-under=78 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  selenium:
    runs-on: ubuntu-latest
    # Advisory: the browser suite drives a real headless Chrome, so occasional
    # flakiness must never block a merge. ubuntu-latest ships Chrome, and
    # Selenium Manager (selenium>=4.20) resolves the driver; the tests start
    # their own uvicorn server, so no extra service setup is needed.
    # Runs alongside the release suite (version tags) and on manual dispatch --
    # never on routine work -- and never gates a merge.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra dcat

      - name: Run Selenium tests (headless Chrome)
        # --timeout caps any hung browser so a stuck test cannot stall the job.
        run: uv run pytest -m selenium tests/test_ui -q --timeout=180

  audit:
    runs-on: ubuntu-latest
    # Advisory: a newly-disclosed CVE in a transitive dependency must not block
    # an unrelated PR — the vulnerability DB updates independently of this code.
    # Runs alongside the release suite (version tags) and on manual dispatch.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        # Use uv-managed CPython (ships ensurepip), so uvx can build pip-audit's
        # isolated environment.
        run: uv python install 3.12

      - name: Audit dependencies for known vulnerabilities
        # Audit the full locked closure — base + all extras + dev group — so a CVE
        # in an optional adapter dep (metaseed[pride], dcat, …) is caught too.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes --all-extras \
            | uvx --python 3.12 pip-audit --requirement /dev/stdin
