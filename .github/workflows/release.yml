name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for hatch-vcs

      - name: Require a changelog entry for this version
        # Sixteen releases once shipped with no changelog entry because the rule
        # existed only as prose. This is its mechanism. Placed before the suite so
        # a missing entry fails in seconds rather than after the full gate, and
        # accepts either heading style ("## v1.2.3" or "## [1.2.3]").
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## (v${version}|\[${version}\])([^0-9]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            echo "Add '## v${version} (YYYY-MM-DD)' describing what this release changes."
            echo "--- current headings ---"
            grep -E '^## ' CHANGELOG.md | head -5
            exit 1
          fi
          echo "Changelog entry found for ${version}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # Must match the CI gate's extras, not just its markers: tests/test_seek
        # imports rdflib, so `--extra dev` alone fails at collection and the
        # release never reaches the publish job.
        run: uv sync --extra dev --extra dcat --extra seek

      - name: Run tests with coverage
        # Match the CI gate: exclude network-marked tests. They hit live third-party
        # APIs (EBI/MetaboLights) and flake for unrelated reasons, so a release must
        # never be blocked by an external outage (per CLAUDE.md "Local must match CI").
        #
        # Coverage is measured here and nowhere else in CI. Measuring it on every
        # pull request trebled that gate for a number nobody reads mid-review;
        # measuring it on the release means the threshold still blocks a publish,
        # at a cost paid once per version instead of once per push.
        run: |
          uv run python -m pytest tests/ \
            -m "not selenium and not network" \
            --ignore=tests/test_ui/test_selenium.py \
            --ignore=tests/test_ui/test_spec_builder_selenium.py \
            --ignore=tests/test_ui/test_validation_selenium.py \
            --ignore=tests/test_ui/selenium/ \
            --cov=src/metaseed \
            --cov-report=xml \
            --cov-fail-under=78 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload dist for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  fresh-install-smoke:
    # The release job tests against uv.lock; `uv tool install metaseed` resolves
    # dependencies fresh. Those can diverge: mcp 2.0.0 satisfied the unbounded
    # `mcp>=1.0.0` pin and removed mcp.server.fastmcp, so every fresh install of
    # v0.21.0 crashed on `metaseed ui` while the locked test suites stayed green.
    # This job does what a user does -- installs the built wheel with a fresh
    # resolution and all feature extras -- and gates the publish on it.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel with a fresh dependency resolution
        run: |
          WHEEL=$(ls dist/*.whl)
          uv venv smoke
          uv pip install --python smoke "metaseed[dcat,ena,brapi,pride] @ file://$PWD/$WHEEL"

      - name: Smoke-test the entry point and every import users hit first
        run: |
          smoke/bin/metaseed --help
          smoke/bin/metaseed version
          smoke/bin/metaseed profiles
          smoke/bin/python -c "from metaseed.ui import run_ui"
          smoke/bin/python -c "from metaseed.agent.mcp.server import create_server; create_server()"
          smoke/bin/python -c "from metaseed import MetaseedClient; MetaseedClient('miappe', '1.1')"

      - name: Boot the web UI and probe it
        run: |
          smoke/bin/metaseed ui --port 8899 &
          UI_PID=$!
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:8899/ >/dev/null; then
              echo "UI answered"
              kill $UI_PID
              exit 0
            fi
          done
          kill $UI_PID || true
          echo "UI never answered" >&2
          exit 1

  publish:
    # Publishes to PyPI via Trusted Publishing (OIDC): no API token is stored in
    # the repo. Requires a matching publisher on PyPI for this repo + workflow +
    # environment. Runs only after the release job's tests and build succeed AND
    # the wheel survives a fresh-resolution install (fresh-install-smoke).
    needs: [release, fresh-install-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the short-lived OIDC token PyPI verifies
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
