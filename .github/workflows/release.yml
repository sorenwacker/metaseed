name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history for hatch-vcs

      - name: Require a changelog entry for this version
        # Sixteen releases once shipped with no changelog entry because the rule
        # existed only as prose. This is its mechanism. Placed before the suite so
        # a missing entry fails in seconds rather than after the full gate, and
        # accepts either heading style ("## v1.2.3" or "## [1.2.3]").
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## (v${version}|\[${version}\])([^0-9]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}."
            echo "Add '## v${version} (YYYY-MM-DD)' describing what this release changes."
            echo "--- current headings ---"
            grep -E '^## ' CHANGELOG.md | head -5
            exit 1
          fi
          echo "Changelog entry found for ${version}."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - name: Install dependencies
        # Must match the CI gate's extras, not just its markers: tests/test_seek
        # imports rdflib, so `--extra dev` alone fails at collection and the
        # release never reaches the publish job.
        run: uv sync --extra dev --extra dcat --extra seek

      - name: Run tests with coverage
        # Match the CI gate: exclude network-marked tests. They hit live third-party
        # APIs (EBI/MetaboLights) and flake for unrelated reasons, so a release must
        # never be blocked by an external outage (per CLAUDE.md "Local must match CI").
        #
        # Coverage is measured here and nowhere else in CI. Measuring it on every
        # pull request trebled that gate for a number nobody reads mid-review;
        # measuring it on the release means the threshold still blocks a publish,
        # at a cost paid once per version instead of once per push.
        run: |
          uv run python -m pytest tests/ \
            -m "not selenium and not network" \
            --ignore=tests/test_ui/test_selenium.py \
            --ignore=tests/test_ui/test_spec_builder_selenium.py \
            --ignore=tests/test_ui/test_validation_selenium.py \
            --ignore=tests/test_ui/selenium/ \
            --cov=src/metaseed \
            --cov-report=xml \
            --cov-fail-under=78 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build package
        run: uv build

      - name: Generate SBOM (CycloneDX, full locked closure)
        # The bill of materials for what this release actually resolves —
        # base, every extra, and dev — so a consumer or scanner can answer
        # "does 0.x ship package P at version V" without reconstructing the
        # environment.
        # The SBOM lives outside dist/: the PyPI upload publishes everything
        # in dist/ and refuses a file that is not a distribution.
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes --all-extras             > /tmp/requirements-sbom.txt
          uvx --python 3.12 --from cyclonedx-bom cyclonedx-py requirements /tmp/requirements-sbom.txt             --output-file sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
            sbom.cdx.json
          generate_release_notes: true

      - name: Upload dist for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  fresh-install-smoke:
    # The wheel we are about to publish must install with a fresh dependency
    # resolution; the job is the shared workflow that also runs weekly and on
    # dependency changes (#286), so release day is not the first time it runs.
    needs: release
    uses: ./.github/workflows/fresh-install-smoke.yml

  publish:
    # Publishes to PyPI via Trusted Publishing (OIDC): no API token is stored in
    # the repo. Requires a matching publisher on PyPI for this repo + workflow +
    # environment. Runs only after the release job's tests and build succeed AND
    # the wheel survives a fresh-resolution install (fresh-install-smoke).
    needs: [release, fresh-install-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the short-lived OIDC token PyPI verifies
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Explicit, though it is the default under Trusted Publishing:
          # PEP 740 attestations are generated and uploaded with the
          # distributions, so a consumer can verify what CI built.
          attestations: true
