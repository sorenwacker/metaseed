name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for hatch-vcs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        # Match the CI gate: exclude network-marked tests. They hit live third-party
        # APIs (EBI/MetaboLights) and flake for unrelated reasons, so a release must
        # never be blocked by an external outage (per CLAUDE.md "Local must match CI").
        run: |
          uv run python -m pytest tests/ \
            -m "not selenium and not network" \
            --ignore=tests/test_ui/test_selenium.py \
            --ignore=tests/test_ui/test_spec_builder_selenium.py \
            --ignore=tests/test_ui/test_validation_selenium.py \
            --ignore=tests/test_ui/selenium/ \
            -q

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Uncomment to publish to PyPI
      # - name: Publish to PyPI
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      #   run: uv run twine upload dist/*
