name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for hatch-vcs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        # Match the CI gate: exclude network-marked tests. They hit live third-party
        # APIs (EBI/MetaboLights) and flake for unrelated reasons, so a release must
        # never be blocked by an external outage (per CLAUDE.md "Local must match CI").
        run: |
          uv run python -m pytest tests/ \
            -m "not selenium and not network" \
            --ignore=tests/test_ui/test_selenium.py \
            --ignore=tests/test_ui/test_spec_builder_selenium.py \
            --ignore=tests/test_ui/test_validation_selenium.py \
            --ignore=tests/test_ui/selenium/ \
            -q

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload dist for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Publishes to PyPI via Trusted Publishing (OIDC): no API token is stored in
    # the repo. Requires a matching publisher on PyPI for this repo + workflow +
    # environment. Runs only after the release job's tests and build succeed.
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the short-lived OIDC token PyPI verifies
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
