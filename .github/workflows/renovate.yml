name: Renovate

# Dependency updates, run from this repository's own Actions. The hosted Mend
# app is installed but has never run on this repository (no dashboard issue,
# no pull request, no configuration complaint), so the schedule lives here,
# with a log in the Actions tab. It reads the same renovate.json.
#
# The token is a fine-grained personal access token stored as the
# RENOVATE_TOKEN secret, not the workflow's GITHUB_TOKEN: pull requests opened
# with GITHUB_TOKEN trigger no other workflows, so the CI gate would never run
# on an update and nothing could ever auto-merge.

on:
  schedule:
    # Weekly, early Monday (UTC), matching the schedule in renovate.json.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
