site_name: Metaseed
site_description: Tools for creating, editing, and validating experimental metadata following MIAPPE standards

theme:
  name: material
  logo: images/metaseed-icon.svg
  favicon: images/metaseed-icon.svg
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Guides:
      - Spec Builder: guides/spec-builder.md
      - Profile Comparison: guides/spec-merge.md
      - Logging: guides/logging.md
  - Profiles:
      - Darwin Core: profiles/darwin-core.md
      - DiSSCo: profiles/dissco.md
      - ENA: profiles/ena.md
      - ISA: profiles/isa.md
      - JERM: profiles/jerm.md
      - MIAPPE: profiles/miappe.md
  - Discussion:
      - ISA vs MIAPPE: discussion/comparison.md
      - Entity Relationships: discussion/entity-relationships.md
      - Profile Design: discussion/profile-design-approaches.md
      - MetaboLights Design: discussion/metabolights-design.md
  - Architecture:
      - Overview: architecture/overview.md
      - Model Factory: architecture/model-factory.md
      - Entity Repository: architecture/entity-repository.md
      - Dataset Repository: architecture/dataset-repository.md
      - UI Helpers: architecture/ui-helpers.md
  - API Reference:
      - CLI: api/cli.md
      - Facade: api/facade.md
      - REST API: api/rest.md
      - Specification Language: api/schema-specs.md
      - Validators: api/validators.md
      - Storage: api/storage.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
