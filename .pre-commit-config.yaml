repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, .]
        pass_filenames: false
      - id: ruff-format
        args: [.]
        pass_filenames: false

  - repo: local
    hooks:
      - id: vulture
        name: vulture dead code
        entry: uv run vulture
        language: system
        types: [python]
        args: [src/, --min-confidence=80]
        pass_filenames: false

      - id: mypy
        name: mypy type check
        entry: uv run python -m mypy src/metaseed
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest
        name: run tests before push
        entry: uv run python -m pytest -x -q --tb=short -n auto -m "not network and not selenium"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
