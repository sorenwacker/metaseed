<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaseed</title>
    <link rel="icon" type="image/svg+xml" href="{{ base_url }}/static/images/metaseed-icon.svg">
    <link rel="icon" type="image/png" sizes="128x128" href="{{ base_url }}/static/images/metaseed-icon-128.png">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="{{ base_url }}/static/css/style.css?v=67">
</head>
<body hx-headers='{"X-Requested-With": "XMLHttpRequest"}'>
    <div class="layout">
        <header class="header">
            <h1 class="header-title">
                <img src="{{ base_url }}/static/images/metaseed-logo-light.svg" alt="Metaseed" class="header-logo">
            </h1>
            <nav class="header-nav">
                <a href="{{ base_url }}/" class="nav-btn active" data-testid="nav-datasets">Datasets</a>
                <a href="{{ base_url }}/spec-builder" class="nav-btn" data-testid="nav-spec-builder">Spec Builder</a>
                <a href="{{ base_url }}/explore/" class="nav-btn" data-testid="nav-explorer">Explorer</a>
            </nav>
            <div class="header-actions">
                <label class="btn btn-header btn-file" data-testid="btn-import">
                    Import
                    <input type="file"
                           accept=".json"
                           hx-post="{{ base_url }}/import"
                           hx-trigger="change"
                           hx-target="#notification-container"
                           hx-swap="beforeend"
                           hx-encoding="multipart/form-data"
                           name="file"
                           hidden>
                </label>
                {% if tree_nodes %}
                <span class="header-divider"></span>
                <button id="graph-toggle" class="btn btn-header" onclick="toggleGraph()" data-testid="btn-graph">
                    Graph
                </button>
                {% endif %}
                <span class="header-divider"></span>
                <button id="mcp-toggle" class="btn btn-header" onclick="toggleMCP()" data-testid="btn-mcp" title="MCP Server">
                    <span id="mcp-status-indicator" class="status-indicator status-off"></span>
                    MCP
                </button>
                <span class="header-divider"></span>
                <div class="dataset-dropdown">
                    <button id="dataset-toggle" class="btn btn-header" onclick="toggleDatasetDropdown()" data-testid="btn-datasets">
                        <span id="dataset-name">Datasets</span>
                    </button>
                    <div id="dataset-menu" class="dataset-menu hidden">
                        <div class="dataset-menu-section">
                            <div class="dataset-save-form">
                                <input type="text" id="dataset-save-name" placeholder="Dataset name" class="form-input form-input-sm">
                                <button class="btn btn-sm btn-primary" onclick="saveDataset()">Save</button>
                            </div>
                        </div>
                        <div class="dataset-menu-section">
                            <div class="dataset-menu-label">Saved Datasets</div>
                            <div id="dataset-list" class="dataset-list">
                                <!-- Populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div id="graph-container" class="graph-container hidden">
            <div id="graph-controls" class="graph-controls">
                <label class="graph-control-label">
                    Spacing
                    <input type="range" id="graph-spacing" min="50" max="500" value="100" title="100" oninput="this.title=this.value; updateGraphPhysics()">
                </label>
                <label class="graph-control-label">
                    Repulsion
                    <input type="range" id="graph-repulsion" min="-1000" max="-100" value="-500" title="-500" oninput="this.title=this.value; updateGraphPhysics()">
                </label>
                <label class="graph-control-label">
                    Gravity
                    <input type="range" id="graph-gravity" min="0" max="0.1" step="0.005" value="0.01" title="0.01" oninput="this.title=this.value; updateGraphPhysics()">
                </label>
                <label class="graph-control-label">
                    Edge
                    <input type="range" id="graph-edge-width" min="0.5" max="5" step="0.5" value="1.5" title="1.5" oninput="this.title=this.value; updateGraphEdgeWidth()">
                </label>
                <button id="graph-layout-btn" class="btn btn-secondary btn-sm" onclick="toggleGraphLayout()">Hierarchical</button>
                <button class="btn btn-secondary btn-sm" onclick="fitGraph()">Fit</button>
            </div>
            <div id="graph-legend" class="graph-legend"></div>
            <div id="graph-view" class="graph-view"></div>
        </div>

        <main class="main" id="main">
            {% block content %}
            {% if datasets is defined %}
            {% include "datasets_list.html" %}
            {% else %}
            {% include "index.html" %}
            {% endif %}
            {% endblock %}
        </main>
    </div>

    <div id="notification-container" class="notification-container"></div>

    {% include "components/lookup_modal.html" %}

    <script>
        // Base URL for API calls (passed from server)
        const BASE_URL = "{{ base_url }}";
    </script>
    <!-- Modular JS files -->
    <script src="{{ base_url }}/static/js/core.js?v=1"></script>
    <script src="{{ base_url }}/static/js/validation.js?v=1"></script>
    <script src="{{ base_url }}/static/js/table-edit.js?v=1"></script>
    <script src="{{ base_url }}/static/js/lookup.js?v=1"></script>
    <script src="{{ base_url }}/static/js/graph.js?v=1"></script>
    <script src="{{ base_url }}/static/js/mcp.js?v=1"></script>
    <script src="{{ base_url }}/static/js/dataset.js?v=1"></script>
</body>
</html>
