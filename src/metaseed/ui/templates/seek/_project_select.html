{% if projects %}
<label style="font-size:0.85rem;" title="A project on your SEEK server. Every SEEK resource must belong to one; this list comes from the instance.">Project on your SEEK server
    <select name="project_id" class="form-input" data-testid="seek-project-select">
        {% for pid, ptitle in projects %}
        <option value="{{ pid }}">{{ ptitle }}</option>
        {% endfor %}
    </select>
</label>
{% else %}
<span class="muted" data-testid="seek-no-projects" style="font-size:0.85rem;">
    No projects found on your SEEK server — check the URL and key on the Plugins page, and that the instance is reachable.
</span>
{% endif %}
