<div class="yaml-preview-container">
    <div class="yaml-preview-header">
        <h4>YAML Preview</h4>
        <div class="yaml-preview-actions">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="copyYamlToClipboard()" title="Copy to clipboard">
                <span id="copy-icon">Copy</span>
            </button>
            <a href="/spec-builder/export" class="btn btn-sm btn-outline-secondary" download title="Download YAML">
                Download
            </a>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="toggleYamlEdit()" id="edit-yaml-btn" title="Edit YAML directly">
                Edit
            </button>
        </div>
    </div>
    <div class="yaml-preview-content" id="yaml-preview-view">
        <pre class="yaml-code"><code id="yaml-code-content">{{ yaml_content }}</code></pre>
    </div>
    <div class="yaml-edit-content" id="yaml-edit-view" style="display: none;">
        <textarea id="yaml-edit-textarea" class="form-control yaml-textarea" rows="20">{{ yaml_content }}</textarea>
        <div class="yaml-edit-actions mt-2">
            <button type="button" class="btn btn-sm btn-primary" onclick="applyYamlEdit()">Apply Changes</button>
            <button type="button" class="btn btn-sm btn-secondary" onclick="cancelYamlEdit()">Cancel</button>
            <span id="yaml-edit-status" class="ms-2 text-muted"></span>
        </div>
    </div>
</div>

<script>
function copyYamlToClipboard() {
    const yamlContent = document.getElementById('yaml-code-content').textContent;
    navigator.clipboard.writeText(yamlContent).then(() => {
        const icon = document.getElementById('copy-icon');
        const original = icon.textContent;
        icon.textContent = 'Copied!';
        setTimeout(() => { icon.textContent = original; }, 2000);
    }).catch(err => {
        console.error('Failed to copy:', err);
        alert('Failed to copy to clipboard');
    });
}

function toggleYamlEdit() {
    const previewView = document.getElementById('yaml-preview-view');
    const editView = document.getElementById('yaml-edit-view');
    const editBtn = document.getElementById('edit-yaml-btn');

    if (editView.style.display === 'none') {
        // Switch to edit mode
        const yamlContent = document.getElementById('yaml-code-content').textContent;
        document.getElementById('yaml-edit-textarea').value = yamlContent;
        previewView.style.display = 'none';
        editView.style.display = 'block';
        editBtn.textContent = 'Preview';
    } else {
        // Switch to preview mode
        editView.style.display = 'none';
        previewView.style.display = 'block';
        editBtn.textContent = 'Edit';
    }
}

function cancelYamlEdit() {
    const previewView = document.getElementById('yaml-preview-view');
    const editView = document.getElementById('yaml-edit-view');
    const editBtn = document.getElementById('edit-yaml-btn');

    editView.style.display = 'none';
    previewView.style.display = 'block';
    editBtn.textContent = 'Edit';
}

function applyYamlEdit() {
    const yamlContent = document.getElementById('yaml-edit-textarea').value;
    const statusEl = document.getElementById('yaml-edit-status');

    statusEl.textContent = 'Applying...';
    statusEl.className = 'ms-2 text-muted';

    fetch('/spec-builder/apply-yaml', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-yaml',
        },
        body: yamlContent
    })
    .then(response => {
        if (!response.ok) {
            return response.text().then(text => { throw new Error(text); });
        }
        return response.text();
    })
    .then(() => {
        statusEl.textContent = 'Applied!';
        statusEl.className = 'ms-2 text-success';
        // Refresh the page to show updated spec
        setTimeout(() => { window.location.reload(); }, 500);
    })
    .catch(err => {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'ms-2 text-danger';
    });
}
</script>
