<div class="yaml-preview-container" id="yaml-container">
    <div class="yaml-preview-header">
        <h4 id="yaml-title">YAML Preview</h4>
        <div class="yaml-preview-actions">
            <button type="button" class="btn btn-sm btn-ghost" onclick="copyYamlToClipboard()" title="Copy to clipboard">
                <span id="copy-icon">Copy</span>
            </button>
            <a href="/spec-builder/export" class="btn btn-sm btn-ghost" download title="Download">
                Download
            </a>
            <button type="button" class="btn btn-sm btn-ghost" onclick="toggleYamlEdit()" id="edit-yaml-btn">
                Edit
            </button>
        </div>
    </div>

    <!-- Preview Mode -->
    <div class="yaml-content" id="yaml-preview-view">
        <pre class="yaml-code"><code id="yaml-code-content">{{ yaml_content }}</code></pre>
    </div>

    <!-- Edit Mode -->
    <div class="yaml-content" id="yaml-edit-view" style="display: none;">
        <textarea id="yaml-edit-textarea" class="yaml-editor">{{ yaml_content }}</textarea>
        <div class="yaml-editor-footer">
            <span id="yaml-edit-status"></span>
            <div class="yaml-editor-buttons">
                <button type="button" class="btn btn-sm btn-secondary" onclick="cancelYamlEdit()">Cancel</button>
                <button type="button" class="btn btn-sm btn-primary" onclick="applyYamlEdit()">Apply</button>
            </div>
        </div>
    </div>
</div>

<script>
function copyYamlToClipboard() {
    const yamlContent = document.getElementById('yaml-code-content').textContent;
    navigator.clipboard.writeText(yamlContent).then(() => {
        const icon = document.getElementById('copy-icon');
        icon.textContent = 'Copied!';
        setTimeout(() => { icon.textContent = 'Copy'; }, 1500);
    }).catch(() => alert('Failed to copy'));
}

function toggleYamlEdit() {
    const previewView = document.getElementById('yaml-preview-view');
    const editView = document.getElementById('yaml-edit-view');
    const editBtn = document.getElementById('edit-yaml-btn');
    const title = document.getElementById('yaml-title');
    const container = document.getElementById('yaml-container');

    if (editView.style.display === 'none') {
        document.getElementById('yaml-edit-textarea').value =
            document.getElementById('yaml-code-content').textContent;
        previewView.style.display = 'none';
        editView.style.display = 'flex';
        editBtn.textContent = 'Preview';
        title.textContent = 'Edit YAML';
        container.classList.add('editing');
    } else {
        editView.style.display = 'none';
        previewView.style.display = 'block';
        editBtn.textContent = 'Edit';
        title.textContent = 'YAML Preview';
        container.classList.remove('editing');
    }
}

function cancelYamlEdit() {
    document.getElementById('yaml-edit-view').style.display = 'none';
    document.getElementById('yaml-preview-view').style.display = 'block';
    document.getElementById('edit-yaml-btn').textContent = 'Edit';
    document.getElementById('yaml-title').textContent = 'YAML Preview';
    document.getElementById('yaml-container').classList.remove('editing');
    document.getElementById('yaml-edit-status').textContent = '';
}

function applyYamlEdit() {
    const yamlContent = document.getElementById('yaml-edit-textarea').value;
    const statusEl = document.getElementById('yaml-edit-status');

    statusEl.textContent = 'Applying...';
    statusEl.className = 'status-text';

    fetch('/spec-builder/apply-yaml', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-yaml' },
        body: yamlContent
    })
    .then(response => {
        if (!response.ok) return response.text().then(t => { throw new Error(t); });
        return response.text();
    })
    .then(() => {
        statusEl.textContent = 'Applied!';
        statusEl.className = 'status-text status-success';
        setTimeout(() => window.location.reload(), 500);
    })
    .catch(err => {
        statusEl.textContent = err.message;
        statusEl.className = 'status-text status-error';
    });
}
</script>
