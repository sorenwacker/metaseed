<div class="field-edit-form">
    <form onsubmit="return updateField(event, '{{ entity_name }}', {{ field_idx }})">

        <!-- Basic Info -->
        <fieldset class="form-section">
            <legend>Basic</legend>
            <div class="field-form-row">
                <div class="form-group">
                    <label class="form-label" title="Snake_case identifier for this field">Name</label>
                    <input type="text"
                           name="name"
                           class="form-input"
                           value="{{ field.name }}"
                           required
                           pattern="[a-z_][a-z0-9_-]*">
                </div>
                <div class="form-group">
                    <label class="form-label" title="Data type for validation and UI rendering">Type</label>
                    <select name="field_type" class="form-input" onchange="updateConstraintVisibility(this.value)">
                        {% for ft in field_types %}
                        <option value="{{ ft }}" {% if field.type == ft %}selected{% endif %}>{{ ft }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group form-group-checkbox">
                    <label class="form-checkbox" title="Field must have a value">
                        <input type="checkbox"
                               name="required"
                               value="true"
                               {% if field.required %}checked{% endif %}>
                        Required
                    </label>
                </div>
                <div class="form-group">
                    <label class="form-label" title="Recommended is advisory; Required stays the validation source of truth">Tier</label>
                    <select name="tier" class="form-input">
                        <option value="" {% if not field.tier %}selected{% endif %}>(unset)</option>
                        <option value="required" {% if field.tier == 'required' %}selected{% endif %}>required</option>
                        <option value="recommended" {% if field.tier == 'recommended' %}selected{% endif %}>recommended</option>
                        <option value="optional" {% if field.tier == 'optional' %}selected{% endif %}>optional</option>
                    </select>
                </div>
                <div class="form-group form-group-checkbox">
                    <label class="form-checkbox" title="This field uniquely identifies the entity (used for node ids and references)">
                        <input type="checkbox" name="is_identifier" value="true"
                               {% if field.is_identifier %}checked{% endif %}>
                        Identifier
                    </label>
                </div>
                <div class="form-group form-group-checkbox">
                    <label class="form-checkbox" title="This field's value is the entity's display label">
                        <input type="checkbox" name="is_label" value="true"
                               {% if field.is_label %}checked{% endif %}>
                        Label
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" title="Human-readable caption for the field (defaults to the name)">Display label</label>
                    <input type="text" name="label" class="form-input"
                           value="{{ field.label or '' }}" placeholder="e.g. Collection date">
                </div>
                <div class="form-group">
                    <label class="form-label" title="Unit of measure, if any">Unit</label>
                    <input type="text" name="unit" class="form-input"
                           value="{{ field.unit or '' }}" placeholder="e.g. cm">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" title="An illustrative value shown when building forms/templates">Example</label>
                    <input type="text" name="example" class="form-input"
                           value="{{ field.example if field.example is not none else '' }}" placeholder="e.g. 2024-05-01">
                </div>
                <div class="form-group">
                    <label class="form-label" title="Explicit choice list (comma-separated); falls back to the enum constraint when empty">Options</label>
                    <input type="text" name="options" class="form-input"
                           value="{{ field.options|join(', ') if field.options else '' }}" placeholder="a, b, c">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" title="Human-readable explanation shown in UI">Description</label>
                <textarea name="description"
                          class="form-input"
                          rows="2"
                          placeholder="Explain what this field captures...">{{ field.description or '' }}</textarea>
            </div>
        </fieldset>

        <!-- Type-specific settings -->
        <fieldset class="form-section" id="type-settings">
            <legend>Type Settings</legend>

            <!-- Entity/List target -->
            <div class="form-group type-setting" data-field-types="list,entity">
                <label class="form-label" title="Target entity type for list items or entity reference">Items/Target Entity</label>
                <input type="text"
                       name="items"
                       class="form-input"
                       value="{{ field.items or '' }}"
                       placeholder="EntityName"
                       list="entity-list">
                <datalist id="entity-list">
                    {% for ename in spec.entities.keys() %}
                    <option value="{{ ename }}">
                    {% endfor %}
                </datalist>
            </div>

            <!-- Owning-parent (containment) marker -->
            <div class="form-group form-group-checkbox type-setting" data-field-types="list,entity">
                <label class="form-checkbox" title="This entity owns the referenced items as tree children. Leave unchecked for embedded value objects or plain lookups (e.g. an OntologyAnnotation).">
                    <input type="checkbox"
                           name="owns"
                           value="true"
                           {% if field.owns %}checked{% endif %}>
                    Owns (containment child, not a lookup)
                </label>
            </div>

            <!-- Ontology lookup filter -->
            <div class="form-group type-setting" data-field-types="ontology_term">
                <label class="form-label" title="Restrict OLS lookup to specific ontologies (e.g., po, chebi, pato)">Ontologies</label>
                <input type="text"
                       name="ontologies"
                       class="form-input"
                       value="{{ field.ontologies|join(', ') if field.ontologies else '' }}"
                       placeholder="po, chebi, pato">
            </div>

            <!-- No settings message -->
            <div class="type-setting type-setting-none" data-field-types="string,integer,float,boolean,date,datetime,uri">
                <p class="text-muted">No type-specific settings needed.</p>
            </div>
        </fieldset>

        <!-- Constraints -->
        <fieldset class="form-section" id="constraints-section">
            <legend>Constraints</legend>

            <!-- String/URI constraints -->
            <div class="constraint-group" data-field-types="string,uri">
                <div class="form-group">
                    <label class="form-label" title="Regular expression pattern to validate input">Pattern</label>
                    <div class="input-with-presets">
                        <input type="text"
                               name="pattern"
                               id="pattern-input"
                               class="form-input"
                               value="{{ field.constraints.pattern if field.constraints else '' }}"
                               placeholder="^[A-Z].*">
                        <div class="preset-buttons">
                            <button type="button" class="preset-btn" onclick="setPattern('^[\\\\w.-]+@[\\\\w.-]+\\\\.[a-z]{2,}$')" title="Email address pattern">Email</button>
                            <button type="button" class="preset-btn" onclick="setPattern('^https?://.*')" title="URL pattern">URL</button>
                            <button type="button" class="preset-btn" onclick="setPattern('^\\\\d{4}-\\\\d{4}-\\\\d{4}-\\\\d{3}[0-9X]$')" title="ORCID identifier">ORCID</button>
                            <button type="button" class="preset-btn" onclick="setPattern('^10\\\\.\\\\d{4,}/.*$')" title="Digital Object Identifier">DOI</button>
                        </div>
                    </div>
                </div>
                <div class="field-form-row">
                    <div class="form-group">
                        <label class="form-label" title="Minimum character count">Min Length</label>
                        <input type="number" name="min_length" class="form-input" min="0"
                               value="{{ field.constraints.min_length if field.constraints and field.constraints.min_length else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" title="Maximum character count">Max Length</label>
                        <input type="number" name="max_length" class="form-input" min="0"
                               value="{{ field.constraints.max_length if field.constraints and field.constraints.max_length else '' }}">
                    </div>
                </div>
            </div>

            <!-- Numeric constraints -->
            <div class="constraint-group" data-field-types="integer,float">
                <div class="field-form-row">
                    <div class="form-group">
                        <label class="form-label" title="Inclusive lower bound">Minimum</label>
                        <input type="number" name="minimum" class="form-input" step="any"
                               value="{{ field.constraints.minimum if field.constraints and field.constraints.minimum is not none else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" title="Inclusive upper bound">Maximum</label>
                        <input type="number" name="maximum" class="form-input" step="any"
                               value="{{ field.constraints.maximum if field.constraints and field.constraints.maximum is not none else '' }}">
                    </div>
                </div>
            </div>

            <!-- List constraints -->
            <div class="constraint-group" data-field-types="list">
                <div class="field-form-row">
                    <div class="form-group">
                        <label class="form-label" title="Minimum number of items in list">Min Items</label>
                        <input type="number" name="min_items" class="form-input" min="0"
                               value="{{ field.constraints.min_items if field.constraints and field.constraints.min_items else '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" title="Maximum number of items in list">Max Items</label>
                        <input type="number" name="max_items" class="form-input" min="0"
                               value="{{ field.constraints.max_items if field.constraints and field.constraints.max_items else '' }}">
                    </div>
                </div>
            </div>

            <!-- Enum values -->
            <div class="constraint-group" data-field-types="string,integer,float">
                <div class="form-group">
                    <label class="form-label" title="Restrict to specific values (leave empty for any value)">Allowed Values</label>
                    <textarea name="enum_values"
                              class="form-input"
                              rows="2"
                              placeholder="value1&#10;value2&#10;value3">{% if field.constraints and field.constraints.enum %}{{ field.constraints.enum|join('\n') }}{% endif %}</textarea>
                </div>
            </div>

            <!-- No constraints -->
            <div class="constraint-group constraint-none" data-field-types="boolean,date,datetime,entity,ontology_term">
                <p class="text-muted">No constraints for this field type.</p>
            </div>
        </fieldset>

        <!-- Advanced (collapsible) -->
        <details class="form-section-collapsible">
            <summary>Advanced</summary>
            <div class="form-section-content">
                <div class="field-form-row">
                    <div class="form-group">
                        <label class="form-label" title="Alternative name for code generation (camelCase)">Codename</label>
                        <input type="text" name="codename" class="form-input"
                               value="{{ field.codename or '' }}" placeholder="camelCase">
                    </div>
                    <div class="form-group">
                        <label class="form-label" title="Semantic ontology reference (e.g., MIAPPE:DM-1)">Ontology Term</label>
                        <input type="text" name="ontology_term" class="form-input"
                               value="{{ field.ontology_term or '' }}" placeholder="MIAPPE:DM-1">
                    </div>
                </div>
                <div class="field-form-row">
                    <div class="form-group">
                        <label class="form-label" title="Enforce uniqueness within parent or globally">Unique Within</label>
                        <select name="unique_within" class="form-input">
                            <option value="">Not unique</option>
                            <option value="parent" {% if field.unique_within == 'parent' %}selected{% endif %}>Parent</option>
                            <option value="global" {% if field.unique_within == 'global' %}selected{% endif %}>Global</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" title="Reference to another entity's field (Entity.field)">Reference</label>
                        <input type="text" name="reference" class="form-input"
                               value="{{ field.reference or '' }}" placeholder="Entity.field">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" title="Parent reference for nested entities (deprecated, use reference)">Parent Ref</label>
                    <input type="text" name="parent_ref" class="form-input"
                           value="{{ field.parent_ref or '' }}" placeholder="Entity.field">
                </div>
                <div class="form-group">
                    <label class="form-label" title="The property of the dataset's DCAT catalogue record this field's value fills. Read on the root entity only.">DCAT Property</label>
                    <input type="text" name="dcat" class="form-input"
                           value="{{ field.dcat or '' }}" placeholder="dct:title"
                           list="dcat-properties">
                    <datalist id="dcat-properties">
                        <option value="dct:title">
                        <option value="dct:description">
                        <option value="dct:identifier">
                        <option value="dct:issued">
                        <option value="dct:license">
                        <option value="dct:accessRights">
                        <option value="dct:publisher">
                        <option value="dct:relation">
                        <option value="dct:source">
                        <option value="dct:conformsTo">
                        <option value="dcat:contactPoint">
                        <option value="dcat:landingPage">
                        <option value="dcat:keyword">
                        <option value="dcat:theme">
                    </datalist>
                </div>
            </div>
        </details>

        <div class="field-form-actions">
            <button type="submit" class="btn btn-primary btn-sm">Save Field</button>
            <button type="button"
                    class="btn btn-secondary btn-sm"
                    hx-get="/spec-builder/entity/{{ entity_name }}"
                    hx-target="#editor-content"
                    hx-swap="innerHTML">
                Cancel
            </button>
        </div>
    </form>
</div>

<script>
function updateConstraintVisibility(fieldType) {
    document.querySelectorAll('.constraint-group, .type-setting').forEach(function(el) {
        var types = el.dataset.fieldTypes ? el.dataset.fieldTypes.split(',') : [];
        el.style.display = types.includes(fieldType) ? '' : 'none';
    });
}

function setPattern(pattern) {
    var input = document.getElementById('pattern-input');
    if (input) { input.value = pattern; input.focus(); }
}

// Initialize visibility
(function() {
    var sel = document.querySelector('select[name="field_type"]');
    if (sel) updateConstraintVisibility(sel.value);
})();
</script>

<style>
.form-section {
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: var(--bg-subtle, #fafafa);
}
.form-section legend {
    font-weight: 600;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted, #666);
    padding: 0 6px;
}
.form-section-collapsible {
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 6px;
    margin-bottom: 12px;
}
.form-section-collapsible summary {
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted, #666);
    background: var(--bg-subtle, #fafafa);
    border-radius: 6px;
}
.form-section-collapsible[open] summary {
    border-radius: 6px 6px 0 0;
    border-bottom: 1px solid var(--border-color, #e0e0e0);
}
.form-section-content {
    padding: 12px 14px;
}
.form-label {
    cursor: help;
}
.form-label[title]:hover {
    text-decoration: underline dotted;
}
.text-muted {
    color: var(--text-muted, #888);
    font-size: 0.9em;
    font-style: italic;
    margin: 0;
}
.input-with-presets {
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.preset-buttons {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.preset-btn {
    padding: 2px 8px;
    font-size: 0.75em;
    border: 1px solid var(--border-color, #ccc);
    border-radius: 3px;
    background: var(--bg-white, #fff);
    cursor: pointer;
}
.preset-btn:hover {
    background: var(--bg-hover, #f0f0f0);
}
.constraint-group {
    margin-bottom: 12px;
}
.constraint-group:last-child {
    margin-bottom: 0;
}
</style>
