{% if notes %}
<div class="notes-list">
    {% for note in notes %}
    <div class="note-item" data-testid="note-item">
        <a href="{{ base_url }}/notes/{{ note.name }}" class="note-link">
            <span class="note-name">{{ note.name }}</span>
            <span class="note-meta">
                {{ note.modified.strftime('%Y-%m-%d %H:%M') }}
            </span>
        </a>
        <button class="btn btn-sm btn-danger note-delete"
                onclick="confirmDelete('{{ note.name }}')"
                title="Delete note"
                data-testid="btn-delete-note">
            Delete
        </button>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="notes-empty">
    <p>No notes yet.</p>
    <a href="{{ base_url }}/notes/new" class="btn btn-primary">Create your first note</a>
</div>
{% endif %}
