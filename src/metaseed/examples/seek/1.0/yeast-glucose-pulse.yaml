# SEEK (JERM) 1.0 example: a project with one investigation, one study and one
# assay, its samples, data file, SOP and model, as a SEEK instance holds them.
# Fictional project; names, mailboxes and identifiers are placeholders.

identifier: PRJ-YEAST-GLUCOSE-PULSE
title: Yeast glucose pulse response
description: Transcript and metabolite response of Saccharomyces cerevisiae to a glucose pulse in chemostat culture.
web_page: https://seek.example.org/projects/1
start_date: "2024-01-01"
end_date: "2025-12-31"
default_license: CC-BY-4.0
default_policy: visible to project members

