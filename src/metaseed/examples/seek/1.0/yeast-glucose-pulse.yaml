                description: Ordinary differential equations fitted to the pulse time course.
                filename: glycolysis.xml
                model_type:
                  term: ordinary differential equations
                  ontology_name: JERM
                model_format: SBML
                environment: COPASI
                environment_url: https://copasi.org
                organism:
                  identifier: ORG-SCEREVISIAE
                  title: Saccharomyces cerevisiae
                  ncbi_id: 4932
                assay_id: ASY-PULSE-METABOLITES
                version: 1
                license: CC-BY-4.0
                created_at: "2024-05-10"
                creators:
                  - identifier: PER-MIRA-EXAMPLE
                    first_name: Mira
                    last_name: Example
                linked_data_files:
                  - identifier: DF-PULSE-CONCENTRATIONS
                    title: Intracellular metabolite concentrations, time course
                    description: The fitted data.
            documents:
