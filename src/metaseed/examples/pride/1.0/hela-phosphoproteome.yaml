# PRIDE v1.0 Example: HeLa phosphoproteome under heat shock
# Demonstrates the PRIDE ProteomeXchange submission model: a Dataset with its
# species, instruments, modifications, contacts, publications, samples and the
# result/raw files, wired to samples via sample_refs.

identifier: PXD-EXAMPLE-HELA-HEATSHOCK
accession: PXD012345
title: Phosphoproteomic dynamics of HeLa cells during acute heat shock
description: >
  Quantitative phosphoproteomic analysis of HeLa cells subjected to acute heat
  shock, profiling dynamic changes in protein phosphorylation across a two-hour
  time course using TMT labelling and high-resolution LC-MS/MS.
sample_processing_protocol: >
  HeLa cells were lysed in 8 M urea, reduced with DTT and alkylated with
  iodoacetamide. Proteins were digested with trypsin and phosphopeptides were
  enriched on TiO2 prior to TMT 10-plex labelling and offline fractionation.
data_processing_protocol: >
  Raw files were processed with MaxQuant against the UniProt human reference
  proteome. Phosphosite localisation used the PTM score, with a 1% false
  discovery rate applied at both the peptide-spectrum match and protein level.
submission_type: COMPLETE
experiment_types:
  - Shotgun proteomics
  - Quantitative proteomics
announcement_date: 2024-09-01
keywords:
  - phosphoproteomics
  - heat shock
  - HeLa
  - TMT

