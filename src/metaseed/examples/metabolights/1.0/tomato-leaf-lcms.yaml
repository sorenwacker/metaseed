# MetaboLights 1.0 example: untargeted LC-MS profiling of tomato leaves under salt stress
# Fictional study; names, mailboxes and identifiers are placeholders.

identifier: MTBLS-EXAMPLE-TOMATO-SALT
title: Untargeted LC-MS metabolite profiling of tomato leaves under salt stress
description: >-
  Leaves of Solanum lycopersicum cv. Moneymaker were sampled seven days after
  the onset of salt stress (150 mM NaCl) and from control plants, extracted in
  methanol and profiled by reversed-phase LC-MS in positive ion mode.
submission_date: "2024-05-02"
public_release_date: "2025-05-02"

contacts:
  - first_name: Mira
    last_name: Example
    email: m.example@example.org
    affiliation: Example Institute of Plant Metabolism
    orcid: "0000-0002-0000-0001"
    roles:
      - principal investigator
      - submitter
  - first_name: Tomas
    last_name: Placeholder
    email: t.placeholder@example.org
    affiliation: Example Institute of Plant Metabolism
    roles:
