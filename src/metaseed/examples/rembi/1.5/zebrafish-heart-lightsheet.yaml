grant_references:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    identifier: ERC-EX-2024-001
    funder: Example Research Council

biosamples:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    title: Zebrafish embryo heart
    organism_scientific_name: Danio rerio
    organism_common_name: zebrafish
    ncbi_taxon: NCBITaxon:7955
    biological_entity: heart
    description: Transgenic embryos expressing a myocardial fluorescent reporter.
    intrinsic_variables:
      - transgenic line myl7 reporter
    extrinsic_variables:
      - incubation temperature 28.5 C
    experimental_variables:
      - developmental stage

specimens:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    title: Agarose-mounted live embryo
    sample_preparation: Embryos dechorionated at 22 hours post fertilisation and embedded in 1 percent low-melt agarose in a glass capillary.
    growth_protocol: Embryos raised at 28.5 C in embryo medium with 0.003 percent PTU to suppress pigmentation.

image_acquisitions:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    title: Light-sheet time lapse
    imaging_method: FBbi:00000369
    imaging_instrument: Example light-sheet microscope with two 10x illumination objectives
    image_acquisition_parameters: 20x 1.0 NA detection objective, 2 um z step, 488 nm excitation, one volume every 10 minutes for 48 hours.

image_correlations:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    title: Registration of the two camera views
    spatial_and_temporal_alignment: The two detection views were registered rigidly per time point and fused.
    fiducials_used: Fluorescent beads embedded in the agarose.
    transformation_matrix: Stored per time point in registration.json beside the volumes.

image_analyses:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    title: Myocardium segmentation
    analysis_overview: The myocardium was segmented in every volume with a trained 3D U-Net; volumes and surface area were measured per time point.

annotations:
  - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
    title: Looping stage
    annotation_overview: The cardiac looping stage was annotated manually for every time point.
    annotation_method: Two annotators scored each time point independently; disagreements were resolved together.
    annotation_type:
      - developmental stage label
    annotation_criteria: Stages follow the standard zebrafish staging series.
    annotation_coverage: Every time point of every embryo.
    annotation_confidence_level: Agreement between annotators was 96 percent.
    authors:
      - study_id: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
        last_name: Placeholder
        first_name: Tomas
        role: annotator
        affiliation_name: Example Institute of Developmental Biology
    file_metadata:
      - annotation_title: Looping stage
        annotation_id: looping-stage-embryo01
        source_image_id: embryo01_fused.ome.zarr
        annotation_type:
          - developmental stage label
        transformations: None; stages were scored on the fused volumes as recorded.
        spatial_information: Whole volume per time point.
        annotation_creation_time: "2025-02-10T14:00:00"

