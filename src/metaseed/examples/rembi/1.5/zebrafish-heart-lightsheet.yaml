# REMBI 1.5 example: light-sheet time-lapse imaging of zebrafish heart development
# Fictional study; names, mailboxes and identifiers are placeholders.

identifier: S-BIAD-EXAMPLE-ZEBRAFISH-HEART
title: Light-sheet imaging of zebrafish heart development from 24 to 72 hours post fertilisation
description: >-
  Whole-heart light-sheet volumes of live zebrafish embryos recorded every ten
  minutes between 24 and 72 hours post fertilisation, with a segmentation of
  the myocardium and manual annotation of the looping stage.
keywords:
  - zebrafish
  - heart development
  - light-sheet microscopy
  - time lapse
