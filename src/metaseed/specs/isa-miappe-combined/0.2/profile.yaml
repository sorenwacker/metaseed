      ontology_term: isaterms:characteristic
      items: Characteristic
    - name: comments
      type: list
      required: false
      description: Comments associated with the material
      items: Comment
    - name: derives_from
      type: list
      required: false
      description: References to parent materials (samples or other materials)
      items: string
    - name: name
      type: string
      required: true
