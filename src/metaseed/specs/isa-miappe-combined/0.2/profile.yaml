    - name: description
      type: string
      required: false
      description: A textual description with components such as objective or goals
      ontology_term: isaterms:description
    - name: design_descriptors
      type: list
      required: false
      description: Classifications of the study based on overall experimental design
      ontology_term: isaterms:study_design
      items: OntologyAnnotation
    - name: end_date
      codename: endDate
      type: datetime
      required: false
      description: 'End date/time. Format: ISO 8601.'
      ontology_term: PPEO:hasEndDateTime
    - name: environments
      codename: environmentParameters
      type: list
      required: false
      description: Environmental conditions.
      ontology_term: PPEO:hasEnvironment
