      items: OntologySource
  OntologySource:
    ontology_term: isaterms:information
    description: Reference to an ontology source
    fields:
    - name: comments
      type: list
      required: false
      description: Comments associated with the ontology source
      items: Comment
    - name: description
      type: string
      required: false
      description: A description of the ontology source
      ontology_term: isaterms:description
    - name: file
      type: string
      required: false
      description: A file name or URI of the ontology source
    - name: name
      type: string
      required: true
      description: The name of the ontology source
      ontology_term: isaterms:name
    - name: version
      type: string
      required: false
      description: The version qualifier of the ontology source
  OtherMaterial:
    ontology_term: isaterms:material
