      reference: Protocol.name
    - name: inputs
      type: list
      required: false
      description: |
        Input materials for this process (sources, samples, or other materials).
      items: MaterialRef
    - name: name
      type: string
      required: false
      description: Process name
      ontology_term: isaterms:name
    - name: outputs
      type: list
      required: false
      description: |
        Output materials from this process (samples, extracts, or data files).
      items: MaterialRef
    - name: parameter_values
      type: list
      required: false
      description: Parameter values for this process instance
      items: ParameterValue
    - name: performer
      type: string
      required: false
      description: Name of the performer
      ontology_term: isaterms:performer
  Protocol:
    ontology_term: isaterms:protocol
    description: An experimental Protocol used in the study
