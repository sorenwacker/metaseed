      ontology_term: isaterms:description
    - name: name
      type: string
      required: true
      description: The name of the protocol
      ontology_term: isaterms:name
    - name: parameters
      type: list
      required: false
      description: Parameters required to execute the protocol
      ontology_term: isaterms:protocol_parameter
      items: ProtocolParameter
    - name: protocol_type
      type: entity
      required: false
      description: Term to classify the protocol
      items: OntologyAnnotation
    - name: study_id
      type: string
      required: true
      description: Reference to the parent Study
      reference: Study.unique_id
    - name: uri
      type: uri
      required: false
      description: URI pointer to protocol resources
    - name: version
      type: string
      required: false
      description: Identifier for the version to ensure protocol tracking
  ProtocolParameter:
    ontology_term: isaterms:protocol_parameter
    description: A parameter used in a protocol
    fields:
    - name: comments
      type: list
