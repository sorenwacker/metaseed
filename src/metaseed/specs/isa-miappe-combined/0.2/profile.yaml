    - name: last_name
      type: string
      required: true
      description: The last name of the person
      ontology_term: isaterms:last_name
    - name: mid_initials
      type: string
      required: false
      description: The middle initials of the person
      ontology_term: isaterms:mid_initials
    - name: name
