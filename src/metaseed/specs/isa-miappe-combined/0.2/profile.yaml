    - name: protocols
      type: list
      required: false
      description: Protocols used within the study
      items: Protocol
    - name: public_release_date
      type: date
      required: false
      description: Date on which the study should be released publicly
      ontology_term: isaterms:release_date
    - name: publications
      type: list
      required: false
      description: Publications associated with the study
      items: Publication
    - name: samples
      type: list
      required: false
      description: Sample materials in the study (all samples must be declared here)
