    - name: sources
      type: list
      required: false
      description: Source materials in the study (all sources must be declared here)
      items: Source
    - name: start_date
      codename: startDate
      type: datetime
      required: false
      description: 'Start date/time. Format: ISO 8601.'
      ontology_term: PPEO:hasStartDateTime
    - name: submission_date
      type: date
      required: false
