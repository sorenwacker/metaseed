      type: list
      required: false
      description: Comments associated with the process
      items: Comment
    - name: date
      type: date
      required: false
      description: Date the process was performed
      ontology_term: isaterms:date
    - name: executes_protocol
      type: entity
      required: false
      description: Reference to the protocol being executed
