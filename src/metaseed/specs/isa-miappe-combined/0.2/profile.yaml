  Investigation:
    ontology_term: isaterms:investigation
    description: |
      An investigation maintains metadata about the project context and links to one or more studies. There can only be one Investigation in an ISA descriptor.
    fields:
    - name: associated_publications
      codename: publications
      type: list
      required: false
      description: DOIs or URLs to associated publications.
      ontology_term: PPEO:hasAssociatedPublication
      items: string
    - name: comments
      type: list
      required: false
      description: Comments associated with the investigation
      items: Comment
    - name: contacts
      type: list
      required: false
      description: People/contacts associated with the investigation
      items: Person
    - name: description
      type: string
      required: false
      description: A textual description of the investigation
      ontology_term: isaterms:description
    - name: filename
      type: string
      required: false
      description: The filename of the investigation file (i_*.txt)
    - name: license
      codename: license
      type: uri
      required: false
      description: URL to the license document.
      ontology_term: PPEO:hasLicense
    - name: miappe_version
      codename: miappeVersion
      type: string
      required: false
      description: Version of MIAPPE standard used.
      ontology_term: PPEO:hasMIAPPEVersion
      constraints:
        pattern: ^[0-9]+\.[0-9]+$
    - name: ontology_source_references
      type: list
      required: false
      description: Ontology sources referenced by OntologyAnnotations in this descriptor
      items: OntologySource
    - name: public_release_date
      type: date
      required: false
      description: Date on which the investigation should be released publicly (ISO8601)
      ontology_term: isaterms:release_date
    - name: publications
      type: list
      required: false
      description: Publications associated with the investigation
      items: Publication
    - name: studies
      type: list
      required: false
      description: Studies contained in this investigation
      items: Study
    - name: submission_date
      type: date
      required: false
      description: Date on which the investigation was reported to the repository (ISO8601)
      ontology_term: isaterms:submission_date
    - name: title
      type: string
      required: true
      description: A concise name given to the investigation
      ontology_term: isaterms:title
    - name: unique_id
      codename: investigationDbId
      type: string
      required: true
      description: Unique identifier for the investigation.
      ontology_term: PPEO:hasIdentifier
      constraints:
        pattern: ^[A-Za-z0-9_-]+$
        min_length: 1
        max_length: 100
    example:
      unique_id: INV-DROUGHT-2024
      identifier: INV-DROUGHT-2024
      title: Drought Tolerance in European Wheat Cultivars
      description: Multi-year field study assessing drought response across 50 wheat varieties under controlled water deficit
        conditions
      submission_date: '2024-03-15'
      public_release_date: '2024-06-01'
      license: https://creativecommons.org/licenses/by/4.0/
      miappe_version: '1.2'
      associated_publications:
      - https://doi.org/10.1234/example.2024.001
      - https://doi.org/10.1234/example.2024.002
  LabeledExtract:
