      ontology_term: isaterms:factor
      items: Factor
    - name: filename
      type: string
      required: false
      description: The name of the Study file (s_*.txt)
    - name: growth_facility_type
      codename: growthFacility
      type: string
      required: false
      description: Type of growth facility.
