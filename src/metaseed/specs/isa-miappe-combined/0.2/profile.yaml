  FactorValue:
    ontology_term: isaterms:factor_value
    description: A FactorValue represents the value instance of a StudyFactor
    fields:
    - name: comments
      type: list
      required: false
      description: Comments associated with the factor value
      items: Comment
    - name: description
      codename: description
      type: string
      required: false
      description: Description of this value.
      ontology_term: PPEO:hasDescription
