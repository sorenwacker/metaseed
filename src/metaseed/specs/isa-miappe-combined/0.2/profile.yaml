    - name: events
      codename: events
      type: list
      required: false
      description: Events during the study.
      ontology_term: PPEO:hasEvent
      items: Event
    - name: experimental_design_description
      codename: experimentalDesignDescription
      type: string
      required: false
      description: Description of the experimental design.
      ontology_term: PPEO:hasDescription
    - name: experimental_design_type
      codename: experimentalDesignType
      type: string
      required: false
      description: Type of experimental design.
      ontology_term: PPEO:hasExperimentalDesign
    - name: experimental_site_name
      codename: locationName
      type: string
      required: false
      description: Name of the experimental site.
      ontology_term: PPEO:hasName
    - name: factors
      type: list
      required: false
