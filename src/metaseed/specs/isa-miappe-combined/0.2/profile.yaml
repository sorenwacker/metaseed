      ontology_term: isaterms:submission_date
    - name: title
      type: string
      required: true
      description: A concise phrase used to encapsulate the purpose and goal of the study
      ontology_term: isaterms:title
    - name: unique_id
      codename: studyDbId
      type: string
      required: true
      description: Unique identifier for the study.
      ontology_term: PPEO:hasIdentifier
      constraints:
        pattern: ^[A-Za-z0-9_-]+$
        min_length: 1
        max_length: 100
