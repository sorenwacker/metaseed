spec_version: '0.6'
version: '4.0'
name: seek-ready-template
display_name: SEEK-ready template (ISA)
description: 'Start here for a profile whose datasets upload to FAIRDOM-SEEK. Clone it, add fields, keep the shape. Fixed structure: Investigation, Study, Source, Sample, AssayMaterial, with Assays listed under the Study; every entity keeps its SEEK role. A Study has exactly one Source type and one Sample type, because SEEK creates one of each per study. Fixed columns: the title of the Investigation, Study and Assay identifies the record, as SEEK has no separate identifier; an Assay''s assay_class and assay_type are required by SEEK; source_name, sample_name and material_name identify each level and carry its ISA title tag; AssayMaterial.assay names the Assay by title. Renaming or removing these breaks the upload. What you can change: add fields to any entity; add assay types, each of which gets its own sample type; mark Investigation, Study and Assay fields SEEK has no attribute for with seek_isa_only; record different kinds of source in the one Source type, for example a plant or a reused dataset named by its accession. An Assay never nests under its inputs: an Assay with several inputs has an AssayMaterial under each Sample it used, all naming it.'
ontology: OBI
root_entity: Investigation
validation_rules: []
entities:
  Investigation:
    description: The overarching project or investigation.
    fields:
    - name: title
      type: string
      required: true
      description: Investigation title; identifies the record, as SEEK has no separate identifier for an Investigation.
      example: Drought response of Arabidopsis thaliana ecotypes
      is_label: true
      is_identifier: true
    - name: description
      type: string
      required: false
      description: What the investigation is about.
      example: Growth, transcriptome and metabolite measurements of two ecotypes under progressive drought
    - name: submission_date
      type: date
      required: false
      description: When the metadata was submitted. Carried in the ISA-JSON export only; SEEK's Investigation has no such
        attribute.
      example: '2024-06-01'
      seek_isa_only: true
    - name: public_release_date
      type: date
      required: false
      description: When it may be released publicly. Carried in the ISA-JSON export only; SEEK's Investigation has no such
        attribute.
      example: '2025-06-01'
      seek_isa_only: true
    - name: studies
      type: list
      required: false
      description: Studies in this investigation.
      items: Study
    seek:
      role: Investigation
  Study:
    description: A study within the investigation.
    fields:
    - name: title
      type: string
      required: true
      description: Study title; identifies the record, as SEEK has no separate identifier for a Study.
      example: Progressive drought in the growth chamber
      is_label: true
      is_identifier: true
    - name: description
      type: string
      required: false
      description: Study description.
      example: Plants were grown for four weeks under controlled conditions, then water was withheld for 72 hours
    - name: study_design_type
      type: string
      required: false
      description: e.g. case-control, time series. Carried in the ISA-JSON export only; SEEK's Study has no such attribute.
      example: time series
      seek_isa_only: true
    - name: start_date
      type: date
      required: false
      description: When the study started. Carried in the ISA-JSON export only; SEEK's Study has no such attribute.
      example: '2024-03-01'
      seek_isa_only: true
    - name: end_date
      type: date
      required: false
      description: When the study ended. Carried in the ISA-JSON export only; SEEK's Study has no such attribute.
      example: '2024-03-18'
      seek_isa_only: true
    - name: experimental_site
      type: string
      required: false
      description: Where the study took place (folded context, not a separate entity). Carried in the ISA-JSON export only;
        SEEK's Study has no such attribute.
      example: Example University growth facility, chamber 3
      seek_isa_only: true
    - name: country
      type: string
      required: false
      description: Country of the experimental site. Carried in the ISA-JSON export only; SEEK's Study has no such attribute.
      example: Exampleland
      seek_isa_only: true
    - name: sources
      type: list
      required: false
      description: Source materials the study started from. Each becomes a Sample of the study's Source Sample Type, the head
        of the ISA material chain.
      items: Source
    - name: assays
      type: list
      required: false
      description: Assays performed in this study.
      items: Assay
    seek:
      role: Study
  Assay:
    description: 'A measurement or an analysis. It does not nest under its inputs: each AssayMaterial it produced names it by title (AssayMaterial.assay), so one Assay can draw on materials from many Samples and Sources.'
    fields:
    - name: title
      type: string
      required: true
      description: Assay title; identifies the record, as SEEK has no separate identifier for an Assay.
      example: Leaf metabolite profiling
      is_label: true
      is_identifier: true
    - name: description
      type: string
      required: false
      description: What the assay measured and how.
      example: Leaf metabolite profiling by LC-MS
    - name: assay_class
      type: string
      required: true
      description: 'SEEK''s assay class: EXP for an experimental assay, MODEL for a modelling analysis.'
      example: EXP
      constraints:
        enum:
        - EXP
        - MODEL
    - name: assay_type
      type: uri
      required: true
      description: SEEK's assay type, a JERM ontology URI.
      example: http://jermontology.org/ontology/JERMOntology#Experimental_assay_type
    - name: measurement_type
      type: string
      required: false
      description: What is measured (e.g. metabolite profiling). Carried in the ISA-JSON export only; SEEK's Assay has no
        such attribute.
      example: metabolite profiling
      seek_isa_only: true
    - name: technology_type
      type: string
      required: false
      description: Technology used (e.g. mass spectrometry). Carried in the ISA-JSON export only; SEEK's Assay has no such
        attribute.
      example: mass spectrometry
      seek_isa_only: true
    - name: technology_platform
      type: string
      required: false
      description: Instrument or platform. Carried in the ISA-JSON export only; SEEK's Assay has no such attribute.
      example: Thermo Q Exactive HF
      seek_isa_only: true
    - name: sops
      type: list
      required: false
      description: The SOPs this assay follows. Each is registered in SEEK by its location and linked to this assay.
      items: SOP
    seek:
      role: Assay
  SOP:
    description: A standard operating procedure the assay follows, registered in SEEK by the location of its document.
    fields:
    - name: title
      type: string
      required: true
      description: SOP title; identifies it, and SEEK titles the SOP with it.
      example: Leaf nitrogen by Dumas combustion
      is_identifier: true
      is_label: true
    - name: description
      type: string
      required: false
      description: What the procedure covers.
      example: Sample drying, milling and combustion settings
    - name: url
      type: uri
      required: true
      description: Where the SOP document is; SEEK registers it by this link.
      example: https://protocols.example.org/sop/leaf-nitrogen-v2.pdf
    seek:
      role: SOP
  Source:
    description: 'What the study starts from, at the head of the ISA material chain: a plant or other biological material, or an existing dataset reused for analysis, named by its accession.'
    fields:
    - name: source_name
      type: string
      required: true
      description: Unique source name.
      example: SRC-001
      is_identifier: true
      is_label: true
    - name: organism
      type: string
      required: false
      description: Source organism (e.g. an NCBI taxon name).
      example: Arabidopsis thaliana
    - name: provider
      type: string
      required: false
      description: Who or what supplied the source material.
      example: Nottingham Arabidopsis Stock Centre
    - name: samples
      type: list
      required: false
      description: Samples collected from this source. Each names this Source as its input.
      items: Sample
    seek:
      role: Sample
  Sample:
    description: 'Something taken from a Source: tissue, an extract, or the part of a reused dataset you work with. Nests under its Source, which SEEK''s ISA-JSON export reads as the sample''s input.'
    fields:
    - name: sample_name
      type: string
      required: true
      description: Unique sample name.
      example: SMP-001
      is_identifier: true
      is_label: true
    - name: organism
      type: string
      required: false
      description: Source organism (e.g. an NCBI taxon name).
      example: Arabidopsis thaliana
    - name: organism_part
      type: string
      required: false
      description: Tissue or part sampled.
      example: rosette leaf
    - name: collection_date
      type: date
      required: false
      description: ''
      example: '2024-03-15'
    - name: assay_materials
      type: list
      required: false
      description: Materials measured from this sample. Each names this Sample as its input.
      items: AssayMaterial
    seek:
      role: Sample
  AssayMaterial:
    description: 'What an Assay produced from a Sample: a material, a data file or an analysis result, at the tail of the ISA material chain. Nests under its Sample and names its Assay by title; an Assay with several inputs has one AssayMaterial under each.'
    fields:
    - name: material_name
      type: string
      required: true
      description: Unique material or data file name.
      example: MAT-001
      is_identifier: true
      is_label: true
    - name: assay
      type: string
      required: true
      description: The Assay that measured this material, by its title.
      example: Leaf metabolite profiling
      reference: Assay.title
    - name: measurement_value
      type: string
      required: false
      description: The value or file produced.
      example: MAT-001_leaf_extract.mzML
      isa_tag: data_file_comment
    seek:
      role: Sample
