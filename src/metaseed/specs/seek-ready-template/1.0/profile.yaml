spec_version: '0.6'
version: '1.0'
name: seek-ready-template
display_name: SEEK-ready template (ISA)
description: A minimal ISA-shaped template for a profile whose datasets upload cleanly to FAIRDOM-SEEK. Every entity
  maps to a SEEK/ISA role (Investigation, Study, Assay, Sample) and nothing sits outside that hierarchy. Clone it and add
  your own fields; keep the shape. There is no ObservationUnit level -- add one only if your data genuinely needs it.
ontology: OBI
root_entity: Investigation
validation_rules: []
entities:
  Investigation:
    description: The overarching project or investigation.
    fields:
    - name: identifier
      type: string
      required: true
      description: Unique investigation id.
      is_identifier: true
    - name: title
      type: string
      required: true
      description: Human-readable title.
      is_label: true
    - name: description
      type: string
      required: false
      description: What the investigation is about.
    - name: submission_date
      type: date
      required: false
      description: When the metadata was submitted.
    - name: public_release_date
      type: date
      required: false
      description: When it may be released publicly.
    - name: studies
      type: list
      required: false
      description: Studies in this investigation.
      items: Study
    seek:
      role: Investigation
  Study:
    description: A study within the investigation.
    fields:
    - name: identifier
      type: string
      required: true
      description: Unique study id.
      is_identifier: true
    - name: title
      type: string
      required: true
      description: Study title.
      is_label: true
    - name: description
      type: string
      required: false
      description: Study description.
    - name: study_design_type
      type: string
      required: false
      description: e.g. case-control, time series.
    - name: start_date
      type: date
      required: false
      description: ''
    - name: end_date
      type: date
      required: false
      description: ''
    - name: experimental_site
      type: string
      required: false
      description: Where the study took place (folded context, not a separate entity).
    - name: country
      type: string
      required: false
      description: Country of the experimental site.
    - name: samples
      type: list
      required: false
      description: Samples collected in this study.
      items: Sample
    - name: assays
      type: list
      required: false
      description: Assays performed in this study.
      items: Assay
    seek:
      role: Study
  Sample:
    description: A biological or material sample.
    fields:
    - name: sample_name
      type: string
      required: true
      description: Unique sample name.
      is_identifier: true
      is_label: true
    - name: organism
      type: string
      required: false
      description: Source organism (e.g. an NCBI taxon name).
    - name: organism_part
      type: string
      required: false
      description: Tissue or part sampled.
    - name: source_material
      type: string
      required: false
      description: What the sample was derived from.
    - name: collection_date
      type: date
      required: false
      description: ''
    seek:
      role: Sample
  Assay:
    description: A measurement performed on samples.
    fields:
    - name: identifier
      type: string
      required: true
      description: Unique assay id.
      is_identifier: true
    - name: title
      type: string
      required: false
      description: Assay title.
      is_label: true
    - name: measurement_type
      type: string
      required: false
      description: What is measured (e.g. metabolite profiling).
    - name: technology_type
      type: string
      required: false
      description: Technology used (e.g. mass spectrometry).
    - name: technology_platform
      type: string
      required: false
      description: Instrument or platform.
    seek:
      role: Assay
