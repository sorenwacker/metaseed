spec_version: '0.6'
version: '1.0'
name: seek-ready-template
display_name: SEEK-ready template (ISA)
description: A minimal ISA-shaped template for a profile whose datasets upload cleanly to FAIRDOM-SEEK. Every entity
  maps to a SEEK/ISA role (Investigation, Study, Assay, Sample) and nothing sits outside that hierarchy. Clone it and add
  your own fields; keep the shape. There is no ObservationUnit level -- add one only if your data genuinely needs it.
ontology: OBI
root_entity: Investigation
validation_rules: []
entities:
  Investigation:
    description: The overarching project or investigation.
    fields:
    - name: identifier
      type: string
      required: true
      description: Unique investigation id.
      example: INV-001
      is_identifier: true
    - name: title
      type: string
      required: true
      description: Human-readable title.
      example: Drought response of Arabidopsis thaliana ecotypes
      is_label: true
    - name: description
      type: string
      required: false
      description: What the investigation is about.
      example: Growth, transcriptome and metabolite measurements of two ecotypes under progressive drought
    - name: submission_date
      type: date
      required: false
      description: When the metadata was submitted.
      example: '2024-06-01'
    - name: public_release_date
      type: date
      required: false
      description: When it may be released publicly.
      example: '2025-06-01'
    - name: studies
      type: list
      required: false
      description: Studies in this investigation.
      items: Study
    seek:
      role: Investigation
  Study:
    description: A study within the investigation.
    fields:
    - name: identifier
      type: string
      required: true
      description: Unique study id.
      example: STU-001
      is_identifier: true
    - name: title
      type: string
      required: true
      description: Study title.
      example: Progressive drought in the growth chamber
      is_label: true
    - name: description
      type: string
      required: false
      description: Study description.
      example: Plants were grown for four weeks under controlled conditions, then water was withheld for 72 hours
    - name: study_design_type
      type: string
      required: false
      description: e.g. case-control, time series.
      example: time series
    - name: start_date
      type: date
      required: false
      description: ''
      example: '2024-03-01'
    - name: end_date
      type: date
      required: false
      description: ''
      example: '2024-03-18'
    - name: experimental_site
      type: string
      required: false
      description: Where the study took place (folded context, not a separate entity).
      example: Example University growth facility, chamber 3
    - name: country
      type: string
      required: false
      description: Country of the experimental site.
      example: Exampleland
    - name: samples
      type: list
      required: false
      description: Samples collected in this study.
      items: Sample
    - name: assays
      type: list
      required: false
      description: Assays performed in this study.
      items: Assay
    seek:
      role: Study
  Sample:
    description: A biological or material sample.
    fields:
    - name: sample_name
      type: string
      required: true
      description: Unique sample name.
      example: SMP-001
      is_identifier: true
      is_label: true
    - name: organism
      type: string
      required: false
      description: Source organism (e.g. an NCBI taxon name).
      example: Arabidopsis thaliana
    - name: organism_part
      type: string
      required: false
      description: Tissue or part sampled.
      example: rosette leaf
    - name: source_material
      type: string
      required: false
      description: What the sample was derived from.
      example: SRC-001
    - name: collection_date
      type: date
      required: false
      description: ''
      example: '2024-03-15'
    seek:
      role: Sample
  Assay:
    description: A measurement performed on samples.
    fields:
    - name: identifier
      type: string
      required: true
      description: Unique assay id.
      example: ASY-001
      is_identifier: true
    - name: title
      type: string
      required: false
      description: Assay title.
      example: Leaf metabolite profiling
      is_label: true
    - name: measurement_type
      type: string
      required: false
      description: What is measured (e.g. metabolite profiling).
      example: metabolite profiling
    - name: technology_type
      type: string
      required: false
      description: Technology used (e.g. mass spectrometry).
      example: mass spectrometry
    - name: technology_platform
      type: string
      required: false
      description: Instrument or platform.
      example: Thermo Q Exactive HF
    seek:
      role: Assay
