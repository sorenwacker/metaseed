spec_version: '0.1'
version: '2.0'
name: health-ri-core
display_name: Health-RI Core Metadata Schema
description: Health-RI core metadata schema v2.0.3 used by the Dutch National Health Data Catalogue, based on DCAT-AP 3, DCAT-AP
  NL and HealthDCAT-AP. Generated from the SHACL shapes (Formalisation(shacl)/Core/PiecesShape) and Documents/Metadata_CoreGenericHealth_v2.xlsx
  of https://github.com/Health-RI/health-ri-metadata (commit acec135). Cardinality follows the SHACL shapes; tier follows
  the Excel requirement level.
ontology: dcat
root_entity: Catalog
validation_rules:
- name: kind_email_format
  description: has_email must be a plain email address
  applies_to:
  - Kind
  field: has_email
  pattern: ^[^@\s:]+@[^@\s]+\.[^@\s]+$
- name: agent_email_format
  description: email must be a plain email address
  applies_to:
  - Agent
  field: email
  pattern: ^[^@\s:]+@[^@\s]+\.[^@\s]+$
entities:
  Catalog:
    ontology_term: dcat:Catalog
    description: A curated collection of metadata about resources (dcat:Catalog). Root of the Health-RI core model.
    fields:
    - name: identifier
      type: string
      required: true
      description: Local identifier of this resource within the metaseed dataset, used by child entities to reference it;
        typically the IRI of the resource. Not a property of the Health-RI model.
      example: catalog-example-health
      constraints:
        pattern: ^\S+$
      is_identifier: true
      is_label: true
    - name: applicable_legislation
      type: list
      required: false
      description: The legislation that mandates the creation or management of the Catalog.
      example: ['http://data.europa.eu/eli/reg/2022/868/oj']
      ontology_term: dcatap:applicableLegislation
      items: uri
      tier: recommended
    - name: catalog
      type: list
      required: false
      description: This property serves to connect the different catalogs with each other.
      example: ['https://example.org/catalogs/partner']
      ontology_term: dcat:catalog
      items: uri
      tier: recommended
    - name: contact_point
      type: entity
      required: false
      description: |-
        This property points to a contact point (department or person) that can answer questions about the catalogue. Details on how to describe these are provided under class vcard:Kind.
        Whenever possible, use a general contact information (for example from a department) instead of contact information of an individual.
      ontology_term: dcat:contactPoint
      items: Kind
      dcat: dcat:contactPoint
      tier: required
    - name: creator
      type: list
      required: false
      description: Note that the Health-RI model diverges from DCAT-AP NL here, which reduces the maximum number of creators
        to 1. The Health-RI model allows specification of multiple creators of a catalogue.
      ontology_term: dct:creator
      items: Agent
      tier: recommended
    - name: dataset
      type: list
      required: false
      description: Each catalog contains one or more datasets. This property serves to link datasets to a catalogue. Therefore,
        a dataset is always contained inside a catalogue.
      ontology_term: dcat:dataset
      items: Dataset
      tier: required
    - name: dataset_series
      type: list
      required: false
      description: Dataset series listed in the catalogue. DCAT 3 models dcat:DatasetSeries as a subclass of dcat:Dataset,
        so these are linked with dcat:dataset.
      ontology_term: dcat:dataset
      items: DatasetSeries
      tier: recommended
    - name: description
      type: list
      required: true
      description: Briefly describe the catalog and what it contains. You can repeat this in multiple languages.
      example: [Metadata catalogue of the Example Health Data Institute]
      ontology_term: dct:description
      constraints:
        min_items: 1
      items: string
      dcat: dct:description
      tier: required
    - name: geographical_coverage
      type: list
      required: false
      description: 'The EU Vocabularies Name Authority Lists must be used for continents, countries and places that are in
        those lists; if a particular location is not in one of the mentioned Named Authority Lists, Geonames URIs must be
        used. For districts or neighbourhoods in NL, the Dutch vocab can be used. Controlled vocabulary: EU Vocabularies Continents
        Named Authority List'
      example: ['http://publications.europa.eu/resource/authority/country/NLD']
      ontology_term: dct:spatial
      items: uri
      tier: recommended
    - name: has_part
      type: list
      required: false
      description: |-
        Use this property to establish another catalogue in this catalogue.
        Note that deeply nested structures should be avoided, and can currently not be displayed in the National Health Data Catalogue.
      example: ['https://example.org/catalogs/imaging']
      ontology_term: dct:hasPart
      items: uri
      tier: recommended
    - name: homepage
      type: uri
      required: false
      description: The home page of the catalogue, if available.
      example: https://example.org/catalog
      ontology_term: foaf:homepage
      tier: recommended
    - name: language
      type: list
      required: false
      description: |-
        The value of this property must be an IRI from the provided controlled vocabulary.
        For example: http://publications.europa.eu/resource/authority/language/NLD Controlled vocabulary: http://publications.europa.eu/resource/authority/language
      example: ['http://publications.europa.eu/resource/authority/language/ENG']
      ontology_term: dct:language
      items: uri
      tier: recommended
    - name: license
      type: uri
      required: false
      description: 'The licence under which the catalogue (with resource description) is made available. In the description
        of distributions and data services the licences of that resources are taken up. Controlled vocabulary: https://definities.geostandaarden.nl/dcat-ap-nl/nl/'
      example: http://publications.europa.eu/resource/authority/licence/CC_BY_4_0
      ontology_term: dct:license
      dcat: dct:license
      tier: recommended
    - name: modification_date
      type: datetime
      required: false
      description: The most recent date on which the Catalogue was modified.
      example: '2024-06-01T12:00:00+00:00'
      ontology_term: dct:modified
      tier: recommended
    - name: publisher
      type: entity
      required: true
      description: 'The organisation or individual that is holder of the intellectual property rights of a dataset. For more
        details about the publisher, see the class Agent. Example: Radboudumc.'
      ontology_term: dct:publisher
      items: Agent
      dcat: dct:publisher
      tier: required
    - name: release_date
      type: datetime
      required: false
      description: The date of formal issuance (e.g., publication) of the Catalogue.
      example: '2023-01-15T09:00:00+00:00'
      ontology_term: dct:issued
      dcat: dct:issued
      tier: recommended
    - name: rights
      type: uri
      required: false
      description: The rights statement should be a free-text statement placed at a web-accessible location such that the
        value of this property is the IRI pointing to that statement.
      example: https://example.org/catalog/rights
      ontology_term: dct:rights
      tier: recommended
    - name: service
      type: list
      required: false
      description: Some datasets may have real-time Data Services (e.g., Beacon API counting individuals). IT teams should
        define the relationship between the catalog and the Data Service via this property. While crucial for interoperability,
        this property is not relevant for end-users to collect.
      ontology_term: dcat:service
      items: DataService
      tier: recommended
    - name: temporal_coverage
      type: list
      required: false
      description: A temporal period that the Catalogue covers, if applicable.
      ontology_term: dct:temporal
      items: PeriodOfTime
      tier: recommended
    - name: theme_taxonomy
      type: list
      required: false
      description: This property refers to a knowledge organisation system used to classify the Catalogue's Datasets. It must
        have at least the value NAL:data-theme as this is the mandatory controlled vocabulary for dcat:theme.
      example: ['http://publications.europa.eu/resource/authority/data-theme']
      ontology_term: dcat:themeTaxonomy
      items: uri
      tier: recommended
    - name: title
      type: list
      required: true
      description: 'Provide a unique title for your catalog, which can be repeated in multiple languages. Example: Healthy
        Brain Study.'
      example: [Example Health Data Institute catalogue]
      ontology_term: dct:title
      constraints:
        min_items: 1
      items: string
      dcat: dct:title
      tier: required
  Dataset:
    ontology_term: dcat:Dataset
    description: A collection of data, published or curated by a single agent (dcat:Dataset), extended with HealthDCAT-AP
      properties.
    fields:
    - name: catalog_id
      type: string
      required: true
      description: Reference to parent Catalog
      example: catalog-example-health
      reference: Catalog.identifier
    - name: access_rights
      type: uri
      required: true
      description: 'Information that indicates whether the Dataset is publicly accessible, has access restrictions or is not
        public. This property must be filled with a value from a controlled vocabulary. Controlled vocabulary: http://publications.europa.eu/resource/authority/access-right'
      example: http://publications.europa.eu/resource/authority/access-right/RESTRICTED
      ontology_term: dct:accessRights
      constraints:
        enum:
        - http://publications.europa.eu/resource/authority/access-right/PUBLIC
        - http://publications.europa.eu/resource/authority/access-right/RESTRICTED
        - http://publications.europa.eu/resource/authority/access-right/NON_PUBLIC
      tier: required
    - name: analytics
      type: list
      required: false
      description: An analytics distribution of the dataset
      example: ['https://example.org/datasets/cohort-2024/analytics']
      ontology_term: healthdcatap:analytics
      items: uri
      tier: recommended
    - name: applicable_legislation
      type: list
      required: true
      description: The legislation that mandates the creation or management of the Dataset. The default value is the ELI of
        the EHDS.
      example: ['http://data.europa.eu/eli/reg/2022/868/oj']
      ontology_term: dcatap:applicableLegislation
      constraints:
        min_items: 1
      items: uri
      tier: required
    - name: code_values
      type: list
      required: false
      description: Health classifications and their codes associated with the dataset
      example: ['http://purl.bioontology.org/ontology/ICD10CM/E11']
      ontology_term: healthdcatap:hasCodeValues
      items: uri
      tier: recommended
    - name: coding_system
      type: list
      required: false
      description: 'Coding systems in use (ex: ICD-10-CM, DGRs, SNOMED=CT, ...)'
      example: ['http://purl.bioontology.org/ontology/ICD10CM']
      ontology_term: healthdcatap:hasCodingSystem
      items: uri
      tier: recommended
    - name: conforms_to
      type: list
      required: false
      description: An implementing rule or other specification
      example: ['https://health-ri.atlassian.net/wiki/spaces/FSD/pages/279281665']
      ontology_term: dct:conformsTo
      items: uri
      tier: recommended
    - name: contact_point
      type: entity
      required: true
      description: Contact information that can be used for sending comments about the Dataset.
      ontology_term: dcat:contactPoint
      items: Kind
      tier: required
    - name: creator
      type: list
      required: true
      description: An entity responsible for producing the dataset.
      ontology_term: dct:creator
      items: Agent
      tier: required
    - name: description
      type: list
      required: true
      description: A free-text account of the Dataset.
      example: [Pseudonymised records of a diabetes cohort followed from 2015 to 2023]
      ontology_term: dct:description
      constraints:
        min_items: 1
      items: string
      tier: required
    - name: distribution
      type: list
      required: false
      description: An available Distribution for the Dataset.
      ontology_term: dcat:distribution
      items: Distribution
      tier: recommended
    - name: documentation
      type: list
      required: false
      description: A page or document about this Dataset.
      example: ['https://example.org/datasets/cohort-2024/docs']
      ontology_term: foaf:page
      items: uri
      tier: recommended
    - name: frequency
      type: uri
      required: false
      description: 'The frequency at which the Dataset is updated. This property must be filled with a value from a controlled
        vocabulary. Controlled vocabulary: http://publications.europa.eu/resource/authority/frequency'
      example: http://publications.europa.eu/resource/authority/frequency/ANNUAL
      ontology_term: dct:accrualPeriodicity
      tier: recommended
    - name: geographical_coverage
      type: list
      required: false
      description: 'A geographic region that is covered by the Dataset. This property must be filled with a value from a controlled
        vocabulary. Controlled vocabulary: EU Vocabularies Continents Named Authority List'
      example: ['http://publications.europa.eu/resource/authority/country/NLD']
      ontology_term: dct:spatial
      items: uri
      tier: recommended
    - name: has_version
      type: list
      required: false
      description: A related Dataset that is a version, edition, or adaptation of the described Dataset.
      example: ['https://example.org/datasets/cohort-2024/v2']
      ontology_term: dcat:hasVersion
      items: uri
      tier: recommended
    - name: health_theme
      type: list
      required: false
      description: A category of the Dataset or tag describing the Dataset.
      example: ['http://www.wikidata.org/entity/Q12206']
      ontology_term: healthdcatap:healthTheme
      items: uri
      tier: recommended
    - name: identifier
      type: string
      required: true
      description: The main identifier for the Dataset, e.g. the URI or other unique identifier in the context of the Catalogue.
      example: https://example.org/datasets/cohort-2024
      ontology_term: dct:identifier
      constraints:
        pattern: ^\S+$
      is_identifier: true
      is_label: true
      tier: required
    - name: in_series
      type: list
      required: false
      description: A dataset series of which the dataset is part.
      example: ['https://example.org/series/diabetes-cohorts']
      ontology_term: dcat:inSeries
      items: uri
      tier: recommended
    - name: is_referenced_by
      type: list
      required: false
      description: A related resource, such as a publication, that references, cites, or otherwise points to the dataset.
      example: ['https://doi.org/10.1234/example.2024.003']
      ontology_term: dct:isReferencedBy
      items: uri
      tier: recommended
    - name: keyword
      type: list
      required: true
      description: A keyword or tag describing the Dataset.
      example: [diabetes, cohort, electronic health records]
      ontology_term: dcat:keyword
      constraints:
        min_items: 1
      items: string
      tier: required
    - name: language
      type: list
      required: false
      description: 'A language of the Dataset.This property must be filled with a value from a controlled vocabulary. Controlled
        vocabulary: http://publications.europa.eu/resource/authority/language'
      example: ['http://publications.europa.eu/resource/authority/language/ENG']
      ontology_term: dct:language
      items: uri
      tier: recommended
    - name: legal_basis
      type: list
      required: false
      description: 'The legal basis used to justify processing of personal data. The legal basis can be provided as a value
        from the dpv taxonomy and should be provided via IRI, for example https://w3id.org/dpv#Consent Controlled vocabulary:
        https://w3c.github.io/dpv/2.0/dpv/modules/legal_basis.html#vocab-legal-basis'
      example: ['https://w3id.org/dpv#Consent']
      ontology_term: dpv:hasLegalBasis
      items: uri
      tier: recommended
    - name: maximum_typical_age
      type: integer
      required: false
      description: Maximum typical age of the population within the dataset
      example: 85
      ontology_term: healthdcatap:maxTypicalAge
      constraints:
        minimum: 0
      tier: recommended
    - name: minimum_typical_age
      type: integer
      required: false
      description: Minimum typical age of the population within the dataset
      example: 18
      ontology_term: healthdcatap:minTypicalAge
      constraints:
        minimum: 0
      tier: recommended
    - name: modification_date
      type: datetime
      required: false
      description: The most recent date on which the Dataset was changed or modified.
      example: '2024-06-01T12:00:00+00:00'
      ontology_term: dct:modified
      tier: recommended
    - name: number_of_records
      type: integer
      required: false
      description: Size of the dataset in terms of the number of records
      example: 125000
      ontology_term: healthdcatap:numberOfRecords
      constraints:
        minimum: 0
      tier: recommended
    - name: number_of_unique_individuals
      type: integer
      required: false
      description: Number of records for unique individuals.
      example: 12500
      ontology_term: healthdcatap:numberOfUniqueIndividuals
      constraints:
        minimum: 0
      tier: recommended
    - name: other_identifier
      type: list
      required: false
      description: A secondary identifier of the Dataset, such as MAST/ADS17, DataCite18, DOI19, EZID20 or W3ID21
      ontology_term: adms:identifier
      items: Identifier
      tier: recommended
    - name: personal_data
      type: list
      required: false
      description: 'Key elements that represent an individual in the dataset. Values can be picked from the dpv taxonomy,
        for example https://w3id.org/dpv/dpv-pd#Gender Controlled vocabulary: https://w3c.github.io/dpv/2.0/pd/'
      example: ['https://w3id.org/dpv/pd#Age', 'https://w3id.org/dpv/pd#HealthRecord']
      ontology_term: dpv:hasPersonalData
      items: uri
      tier: recommended
    - name: population_coverage
      type: list
      required: false
      description: A definition of the population within the dataset
      example: [Adults diagnosed with type 2 diabetes at a participating hospital between 2015 and 2023]
      ontology_term: healthdcatap:populationCoverage
      items: string
      tier: recommended
    - name: publisher
      type: entity
      required: true
      description: An entity (organisation) responsible for making the Dataset available.
      ontology_term: dct:publisher
      items: Agent
      tier: required
    - name: purpose
      type: list
      required: false
      description: 'Indicates association with Purpose. One (or many) category or sub-category of the purposes can be chosen
        from the taxonomy provided by dpv and should be provided via IRI, for example https://w3id.org/dpv#ScientificResearch
        Controlled vocabulary: https://w3c.github.io/dpv/2.1/dpv/#vocab-purposes'
      example: ['https://w3id.org/dpv#AcademicResearch']
      ontology_term: dpv:hasPurpose
      items: uri
      tier: recommended
    - name: qualified_attribution
      type: list
      required: false
      description: An Agent having some form of responsibility for the resource
      ontology_term: prov:qualifiedAttribution
      items: Attribution
      tier: recommended
    - name: qualified_relation
      type: list
      required: false
      description: A description of a relationship with another resource
      ontology_term: dcat:qualifiedRelation
      items: Relationship
      tier: recommended
    - name: quality_annotation
      type: list
      required: false
      description: A statement related to quality of the Dataset, including rating, quality certificate, feedback that can
        be associated to the dataset
      ontology_term: dqv:hasQualityAnnotation
      items: QualityCertificate
      tier: recommended
    - name: release_date
      type: datetime
      required: false
      description: The date of formal issuance (e.g., publication) of the Dataset.
      example: '2024-03-01T09:00:00+00:00'
      ontology_term: dct:issued
      tier: recommended
    - name: retention_period
      type: entity
      required: false
      description: A temporal period which the dataset is available for secondary use
      ontology_term: healthdcatap:retentionPeriod
      items: PeriodOfTime
      tier: recommended
    - name: sample
      type: list
      required: false
      description: A sample distribution of the dataset
      example: ['https://example.org/datasets/cohort-2024/sample']
      ontology_term: adms:sample
      items: uri
      tier: recommended
    - name: source
      type: list
      required: false
      description: A related dataset from which the described dataset is derived
      example: ['https://example.org/datasets/ehr-extract-2023']
      ontology_term: dct:source
      items: uri
      tier: recommended
    - name: status
      type: uri
      required: false
      description: 'The status of a dataset. This property can be filled with a value from a controlled vocabulary. Controlled
        vocabulary: https://publications.europa.eu/resource/authority/dataset-status'
      example: http://publications.europa.eu/resource/authority/dataset-status/COMPLETED
      ontology_term: adms:status
      tier: recommended
    - name: temporal_coverage
      type: list
      required: false
      description: A temporal period that the Dataset covers.
      ontology_term: dct:temporal
      items: PeriodOfTime
      tier: recommended
    - name: temporal_resolution
      type: string
      required: false
      description: The minimum time period resolvable in the dataset.
      example: P1D
      ontology_term: dcat:temporalResolution
      constraints:
        pattern: ^-?P((\d+Y(\d+M)?(\d+D)?|\d+M(\d+D)?|\d+D)(T(\d+H(\d+M)?(\d+(\.\d+)?S)?|\d+M(\d+(\.\d+)?S)?|\d+(\.\d+)?S))?|T(\d+H(\d+M)?(\d+(\.\d+)?S)?|\d+M(\d+(\.\d+)?S)?|\d+(\.\d+)?S))$
      tier: recommended
    - name: theme
      type: list
      required: true
      description: 'A category of the Dataset. This property must be filled with a value from a controlled vocabulary. The
        default value of this property is http://publications.europa.eu/resource/authority/data-theme/HEAL from the controlled
        vocabulary. Controlled vocabulary: Dataset Theme Vocabulary'
      example: ['http://publications.europa.eu/resource/authority/data-theme/HEAL']
      ontology_term: dcat:theme
      constraints:
        min_items: 1
      items: uri
      tier: required
    - name: title
      type: list
      required: true
      description: A name given to the Dataset.
      example: [Type 2 diabetes cohort 2015-2023]
      ontology_term: dct:title
      constraints:
        min_items: 1
      items: string
      tier: required
    - name: type
      type: list
      required: false
      description: 'A type of the Dataset.This property must be filled with a value from a controlled vocabulary. Controlled
        vocabulary: Dataset-type authority table'
      example: ['http://publications.europa.eu/resource/authority/dataset-type/STATISTICAL']
      ontology_term: dct:type
      items: uri
      tier: recommended
    - name: version
      type: string
      required: false
      description: The version indicator (name or identifier) of a resource.
      example: '2.1'
      ontology_term: dcat:version
      tier: recommended
    - name: version_notes
      type: list
      required: false
      description: A description of the differences between this version and a previous version of the Dataset
      example: [Added the 2023 follow-up visits and corrected the medication coding]
      ontology_term: adms:versionNotes
      items: string
      tier: recommended
    - name: was_generated_by
      type: list
      required: false
      description: An activity that generated, or provides the business context for, the creation of the dataset.
      example: ['https://example.org/activities/ehr-extraction-2024']
      ontology_term: prov:wasGeneratedBy
      items: uri
      tier: recommended
  Distribution:
    ontology_term: dcat:Distribution
    description: A specific representation of a dataset, e.g. a downloadable file or an access URL (dcat:Distribution).
    fields:
    - name: dataset_id
      type: string
      required: true
      description: Reference to parent Dataset
      example: https://example.org/datasets/cohort-2024
      reference: Dataset.identifier
    - name: identifier
      type: string
      required: true
      description: Local identifier of this resource within the metaseed dataset, used by child entities to reference it;
        typically the IRI of the resource. Not a property of the Health-RI model.
      example: https://example.org/datasets/cohort-2024/distributions/csv
      constraints:
        pattern: ^\S+$
      is_identifier: true
      is_label: true
    - name: access_service
      type: uri
      required: false
      description: A data service that gives access to the distribution of the dataset.
      example: https://example.org/services/cohort-api
      ontology_term: dcat:accessService
      tier: recommended
    - name: access_url
      type: uri
      required: true
      description: The resource at the access URL may contain information about how to get the Dataset.
      example: https://example.org/datasets/cohort-2024/access
      ontology_term: dcat:accessURL
      tier: required
    - name: applicable_legislation
      type: list
      required: false
      description: The legislation that is applicable to this resource.
      example: ['http://data.europa.eu/eli/reg/2016/679/oj']
      ontology_term: dcatap:applicableLegislation
      items: uri
      tier: recommended
    - name: byte_size
      type: integer
      required: true
      description: The size of a distribution in bytes.
      example: 524288000
      ontology_term: dcat:byteSize
      constraints:
        minimum: 0
      tier: required
    - name: checksum
      type: entity
      required: false
      description: The checksum is related to the downloadURL.
      ontology_term: spdx:checksum
      items: Checksum
      tier: recommended
    - name: compression_format
      type: uri
      required: false
      description: 'It SHOULD be expressed using a media type as defined in the official register of media types managed by
        IANA. Controlled vocabulary: IANA Media Types'
      example: http://www.iana.org/assignments/media-types/application/gzip
      ontology_term: dcat:compressFormat
      tier: recommended
    - name: description
      type: list
      required: false
      description: This property can be repeated for parallel language versions of the description.
      example: [Comma-separated tables, one per visit type, gzip compressed]
      ontology_term: dct:description
      items: string
      tier: recommended
    - name: documentation
      type: list
      required: false
      description: A homepage for some thing.
      example: ['https://example.org/datasets/cohort-2024/docs/csv']
