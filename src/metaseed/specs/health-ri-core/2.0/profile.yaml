        provided by the dataset with which this Data Service is connected. For instance the data service adheres to the OGC
        WFS API standard, while the associated dataset adheres to the INSPIRE Address data model.
      example: ['https://www.hl7.org/fhir/R4']
      ontology_term: dct:conformsTo
      items: uri
      tier: recommended
