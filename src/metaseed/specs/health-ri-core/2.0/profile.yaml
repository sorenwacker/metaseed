      ontology_term: dct:language
      items: uri
      tier: recommended
    - name: license
      type: uri
      required: true
      description: 'A licence under which the Data service is made available. Controlled vocabulary: https://definities.geostandaarden.nl/dcat-ap-nl/nl/'
      example: http://publications.europa.eu/resource/authority/licence/CC_BY_4_0
