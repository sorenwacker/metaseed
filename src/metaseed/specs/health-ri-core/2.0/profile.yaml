    - name: creator
      type: list
      required: false
      description: An entity responsible for making the resource.
      ontology_term: dct:creator
      items: Agent
      tier: recommended
    - name: rights
      type: list
      required: false
      description: Information about rights held in and over the resource.
      example: ['https://example.org/services/cohort-api/rights']
      ontology_term: dct:rights
      items: uri
