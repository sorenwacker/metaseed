      ontology_term: dcat:endpointURL
      tier: required
    - name: format
      type: list
      required: false
      description: 'The structure that can be returned by querying the endpointURL. Controlled vocabulary: http://publications.europa.eu/resource/authority/file-type'
      example: ['http://publications.europa.eu/resource/authority/file-type/JSON']
      ontology_term: dct:format
      items: uri
      tier: recommended
    - name: hvd_category
