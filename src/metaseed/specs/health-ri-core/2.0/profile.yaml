    - name: title
      type: list
      required: true
      description: This property can be repeated for parallel language versions of the title.
      example: [Cohort 2015-2023, CSV]
      ontology_term: dct:title
      constraints:
        min_items: 1
      items: string
      tier: recommended
  DataService:
    ontology_term: dcat:DataService
