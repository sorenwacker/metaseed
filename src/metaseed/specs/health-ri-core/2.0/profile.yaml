      ontology_term: dct:language
      items: uri
      tier: recommended
    - name: license
      type: uri
      required: true
      description: 'A legal document giving official permission to do something with the resource. Controlled vocabulary:
        https://definities.geostandaarden.nl/dcat-ap-nl/nl/'
      example: http://publications.europa.eu/resource/authority/licence/CC_BY_NC_4_0
      ontology_term: dct:license
      tier: required
    - name: linked_schemas
      type: list
      required: false
      description: An established standard to which the described resource conforms.
