      items: uri
      tier: recommended
    - name: media_type
      type: uri
      required: false
      description: 'The media type of the distribution as defined by IANA. Controlled vocabulary: IANA Media Types'
      example: http://www.iana.org/assignments/media-types/text/csv
      ontology_term: dcat:mediaType
      tier: recommended
    - name: modification_date
      type: datetime
      required: false
      description: Date on which the resource was changed.
      example: '2024-06-01T12:00:00+00:00'
      ontology_term: dct:modified
      tier: recommended
    - name: packaging_format
      type: uri
      required: false
      description: 'It SHOULD be expressed using a media type as defined in the official register of media types managed by
        IANA. Controlled vocabulary: IANA Media Types'
      example: http://www.iana.org/assignments/media-types/application/zip
      ontology_term: dcat:packageFormat
      tier: recommended
    - name: release_date
      type: datetime
      required: false
      description: The date the dataset distribution was issued.
      example: '2024-03-01T09:00:00+00:00'
      ontology_term: dct:issued
      tier: recommended
    - name: retention_period
      type: entity
      required: false
      description: A temporal period which the dataset is available for secondary use.
      ontology_term: healthdcatap:retentionperiod
      items: PeriodOfTime
      tier: recommended
    - name: rights
      type: uri
      required: true
      description: A statement that concerns all rights not addressed in fields License or Rights, such as copyright statements.
        Everything that is not covered with licece
      example: https://example.org/datasets/cohort-2024/rights
      ontology_term: dct:rights
      tier: required
    - name: status
      type: uri
      required: false
      description: 'The status of the distribution in the context of maturity lifecycle. Controlled vocabulary: EU Vocabularies
        Distribution Status'
      example: http://publications.europa.eu/resource/authority/distribution-status/COMPLETED
      ontology_term: adms:status
      constraints:
        enum:
        - http://publications.europa.eu/resource/authority/distribution-status/COMPLETED
        - http://publications.europa.eu/resource/authority/distribution-status/DEVELOP
        - http://publications.europa.eu/resource/authority/distribution-status/WITHDRAWN
        - http://publications.europa.eu/resource/authority/distribution-status/DEPRECATED
      tier: recommended
    - name: temporal_resolution
      type: string
      required: false
      description: Minimum time period resolvable in the dataset.
      example: P1D
