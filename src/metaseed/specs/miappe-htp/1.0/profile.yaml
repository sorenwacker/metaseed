version: '1.0'
name: miappe-htp
display_name: MIAPPE-HTP
description: MIAPPE for High-Throughput Phenotyping based on PPEO ontology.
root_entity: Investigation
ontology: PPEO
validation_rules: []
entities:
  Investigation:
    ontology_term: PPEO:investigation
    description: A phenotyping investigation containing one or more studies.
    fields:
    - name: name
      codename: investigationName
      type: string
      required: true
      description: Name of the investigation.
      ontology_term: PPEO:hasName
    - name: description
      codename: investigationDescription
      type: string
      required: false
      description: Description of the investigation.
      ontology_term: PPEO:hasDescription
    - name: submission_date
      codename: submissionDate
      type: date
      required: false
      description: Date submitted to archive.
      ontology_term: PPEO:hasSubmissionDate
    - name: public_release_date
      codename: publicReleaseDate
      type: date
      required: false
      description: Date of public release.
      ontology_term: PPEO:hasPublicReleaseDate
    - name: license
      codename: license
      type: uri
      required: false
      description: License URL.
      ontology_term: PPEO:hasLicense
    - name: miappe_version
      codename: miappeVersion
      type: string
      required: false
      description: MIAPPE version used.
      ontology_term: PPEO:hasMIAPPEVersion
    - name: associated_publications
      codename: publications
      type: list
      items: string
      required: false
      description: DOIs or URLs to publications.
      ontology_term: PPEO:hasAssociatedPublication
    - name: participating_institutions
      codename: participatingInstitutions
      type: list
      items: Institution
      required: false
      description: Institutions participating in the investigation.
      ontology_term: PPEO:hasParticipatingInstitution
    - name: person_roles
      codename: personRoles
      type: list
      items: Role
      required: false
      description: Persons with roles in the investigation.
      ontology_term: PPEO:hasPersonWithRole
    - name: studies
      codename: studies
      type: list
      items: Study
      required: false
      description: Studies in this investigation.
      ontology_term: PPEO:hasPart
  Study:
    ontology_term: PPEO:study
    description: A single experiment within an investigation.
    fields:
    - name: name
      codename: studyName
      type: string
      required: true
      description: Name of the study.
      ontology_term: PPEO:hasName
    - name: description
      codename: studyDescription
      type: string
      required: false
      description: Description of the study.
      ontology_term: PPEO:hasDescription
    - name: start_date
      codename: startDate
      type: datetime
      required: false
      description: Start date/time.
      ontology_term: PPEO:hasStartDateTime
    - name: end_date
      codename: endDate
      type: datetime
      required: false
      description: End date/time.
      ontology_term: PPEO:hasEndDateTime
    - name: cultural_practices
      codename: culturalPractices
      type: string
      required: false
      description: Cultural practices applied.
      ontology_term: PPEO:hasCulturalPractices
    - name: observation_unit_description
      codename: observationUnitDescription
      type: string
      required: false
      description: Description of observation units.
      ontology_term: PPEO:hasObservationUnitDescription
    - name: investigation
      codename: investigation
      type: entity
      items: Investigation
      required: false
      description: Parent investigation.
      ontology_term: PPEO:partOf
    - name: location
      codename: location
      type: entity
      items: Location
      required: false
      description: Geographic location of the study.
      ontology_term: PPEO:hasLocation
    - name: contact_institution
      codename: contactInstitution
      type: entity
      items: Institution
      required: false
      description: Contact institution for the study.
      ontology_term: PPEO:hasContactInstitution
    - name: participating_institutions
      codename: participatingInstitutions
      type: list
      items: Institution
      required: false
      description: Participating institutions.
      ontology_term: PPEO:hasParticipatingInstitution
    - name: experimental_design
      codename: experimentalDesign
      type: entity
      items: ExperimentalDesign
      required: false
      description: Experimental design of the study.
      ontology_term: PPEO:hasExperimentalDesign
    - name: growth_facility
      codename: growthFacility
      type: entity
      items: GrowthFacility
      required: false
      description: Growth facility used.
      ontology_term: PPEO:hasGrowthFacility
    - name: observation_level_hierarchy
      codename: observationLevelHierarchy
      type: entity
      items: ObservationLevelHierarchy
      required: false
      description: Hierarchy of observation levels.
      ontology_term: PPEO:hasObservationLevelHierarchy
    - name: person_roles
      codename: personRoles
      type: list
      items: Role
      required: false
      description: Persons with roles in the study.
      ontology_term: PPEO:hasPersonWithRole
    - name: biological_materials
      codename: biologicalMaterials
      type: list
      items: BiologicalMaterial
      required: false
      description: Biological materials used.
      ontology_term: PPEO:hasBiologicalMaterial
    - name: data_files
      codename: dataFiles
      type: list
      items: DataFile
      required: false
      description: Data files.
      ontology_term: PPEO:hasDataFile
    - name: environments
      codename: environments
      type: list
      items: Environment
      required: false
      description: Environmental conditions.
      ontology_term: PPEO:hasEnvironment
    - name: factors
      codename: factors
      type: list
      items: Factor
      required: false
      description: Experimental factors.
      ontology_term: PPEO:hasFactor
    - name: events
      codename: events
      type: list
      items: Event
      required: false
      description: Events during the study.
      ontology_term: PPEO:hasEvent
  BiologicalMaterial:
    ontology_term: PPEO:biological_material
    description: Biological material (germplasm) used in a study.
    fields:
    - name: name
      codename: biologicalMaterialName
      type: string
      required: true
      description: Name of the biological material.
      ontology_term: PPEO:hasName
    - name: description
      codename: biologicalMaterialDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: genus
      codename: genus
      type: string
      required: false
      description: Genus.
      ontology_term: PPEO:hasGenus
    - name: species
      codename: species
      type: string
      required: false
      description: Species.
      ontology_term: PPEO:hasSpecies
    - name: infraspecific_name
      codename: infraspecificName
      type: string
      required: false
      description: Subspecies, variety, or cultivar.
      ontology_term: PPEO:hasInfraspecificName
    - name: accession_number
      codename: accessionNumber
      type: string
      required: false
      description: Accession number.
      ontology_term: PPEO:hasGermplasmAccessionNumber
    - name: material_source
      codename: materialSource
      type: entity
      items: MaterialSource
      required: false
      description: Source of the material.
      ontology_term: PPEO:hasMaterialSource
    - name: country_of_origin
      codename: countryOfOrigin
      type: entity
      items: Country
      required: false
      description: Country of origin.
      ontology_term: PPEO:hasCountryOfOrigin
    - name: location
      codename: location
      type: entity
      items: Location
      required: false
      description: Collection location.
      ontology_term: PPEO:hasLocation
  Country:
    ontology_term: PPEO:country
    description: A country.
    fields:
    - name: name
      codename: countryName
      type: string
      required: true
      description: Country name.
      ontology_term: PPEO:hasName
    - name: code
      codename: countryCode
      type: string
      required: false
      description: Country code.
      ontology_term: PPEO:hasCountryCode
  DataFile:
    ontology_term: PPEO:data_file
    description: A data file.
    fields:
    - name: name
      codename: dataFileName
      type: string
      required: true
      description: File name.
      ontology_term: PPEO:hasName
    - name: description
      codename: dataFileDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: location
      codename: digitalLocation
      type: uri
      required: false
      description: URL or path to file.
      ontology_term: PPEO:hasDigitalLocation
    - name: version
      codename: version
      type: string
      required: false
      description: File version.
      ontology_term: PPEO:hasVersion
    - name: observations
      codename: observations
      type: list
      items: Observation
      required: false
      description: Observations in this file.
      ontology_term: PPEO:hasObservation
  Environment:
    ontology_term: PPEO:environment
    description: Environmental conditions.
    fields:
    - name: name
      codename: environmentName
      type: string
      required: true
      description: Environment name.
      ontology_term: PPEO:hasName
    - name: description
      codename: environmentDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: parameters
      codename: parameters
      type: list
      items: EnvironmentParameter
      required: false
      description: Environment parameters.
      ontology_term: PPEO:hasEnvironmentParameter
  EnvironmentParameter:
    ontology_term: PPEO:environment_parameter
    description: An environmental parameter measurement.
    fields:
    - name: name
      codename: parameterName
      type: string
      required: true
      description: Parameter name.
      ontology_term: PPEO:hasName
    - name: value
      codename: value
      type: string
      required: false
      description: Parameter value.
      ontology_term: PPEO:hasValue
    - name: unit
      codename: unit
      type: string
      required: false
      description: Unit of measurement.
      ontology_term: PPEO:hasUnit
  Event:
    ontology_term: PPEO:event
    description: An event during a study.
    fields:
    - name: name
      codename: eventName
      type: string
      required: true
      description: Event name/type.
      ontology_term: PPEO:hasName
    - name: description
      codename: eventDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: date
      codename: date
      type: datetime
      required: false
      description: Event date/time.
      ontology_term: PPEO:hasDateTime
    - name: end_date
      codename: endDate
      type: datetime
      required: false
      description: Event end date/time.
      ontology_term: PPEO:hasEndDateTime
  ExperimentalDesign:
    ontology_term: PPEO:experimental_design
    description: Experimental design of a study.
    fields:
    - name: type
      codename: experimentalDesignType
      type: string
      required: true
      description: Design type.
      ontology_term: PPEO:hasType
    - name: description
      codename: experimentalDesignDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: map
      codename: experimentalDesignMap
      type: uri
      required: false
      description: URL to design map.
      ontology_term: PPEO:hasExperimentalDesignMap
  Factor:
    ontology_term: PPEO:factor
    description: An experimental factor.
    fields:
    - name: name
      codename: factorName
      type: string
      required: true
      description: Factor name.
      ontology_term: PPEO:hasName
    - name: description
      codename: factorDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: values
      codename: factorValues
      type: list
      items: FactorValue
      required: false
      description: Factor values/modalities.
      ontology_term: PPEO:hasModality
  FactorValue:
    ontology_term: PPEO:factor_value
    description: A value/modality of a factor.
    fields:
    - name: value
      codename: value
      type: string
      required: true
      description: The value.
      ontology_term: PPEO:hasValue
    - name: description
      codename: description
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: factor
      codename: factor
      type: entity
      items: Factor
      required: false
      description: Parent factor.
      ontology_term: PPEO:isModalityOf
  GrowthFacility:
    ontology_term: PPEO:growth_facility
    description: A growth facility.
    fields:
    - name: name
      codename: growthFacilityName
      type: string
      required: true
      description: Facility name.
      ontology_term: PPEO:hasName
    - name: type
      codename: growthFacilityType
      type: string
      required: false
      description: Facility type.
      ontology_term: PPEO:hasType
    - name: description
      codename: growthFacilityDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
  Institution:
    ontology_term: PPEO:institution
    description: An institution.
    fields:
    - name: name
      codename: institutionName
      type: string
      required: true
      description: Institution name.
      ontology_term: PPEO:hasName
    - name: abbreviation
      codename: abbreviation
      type: string
      required: false
      description: Abbreviation.
      ontology_term: PPEO:hasAbbreviation
    - name: address
      codename: address
      type: string
      required: false
      description: Address.
      ontology_term: PPEO:hasAddress
    - name: location
      codename: location
      type: entity
      items: Location
      required: false
      description: Location.
      ontology_term: PPEO:hasLocation
  Location:
    ontology_term: PPEO:location
    description: A geographic location.
    fields:
    - name: name
      codename: locationName
      type: string
      required: false
      description: Location name.
      ontology_term: PPEO:hasName
    - name: latitude
      codename: latitude
      type: float
      required: false
      description: Latitude.
      ontology_term: PPEO:hasLatitude
    - name: longitude
      codename: longitude
      type: float
      required: false
      description: Longitude.
      ontology_term: PPEO:hasLongitude
    - name: altitude
      codename: altitude
      type: float
      required: false
      description: Altitude.
      ontology_term: PPEO:hasAltitude
    - name: country
      codename: country
      type: entity
      items: Country
      required: false
      description: Country.
      ontology_term: PPEO:hasCountry
  MaterialSource:
    ontology_term: PPEO:material_source
    description: Source of biological material.
    fields:
    - name: name
      codename: materialSourceName
      type: string
      required: true
      description: Source name.
      ontology_term: PPEO:hasName
    - name: description
      codename: materialSourceDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: institute_code
      codename: instituteCode
      type: string
      required: false
      description: Institute code.
      ontology_term: PPEO:hasInstituteCode
    - name: location
      codename: location
      type: entity
      items: Location
      required: false
      description: Location.
      ontology_term: PPEO:hasLocation
  Method:
    ontology_term: PPEO:method
    description: A measurement method.
    fields:
    - name: name
      codename: methodName
      type: string
      required: true
      description: Method name.
      ontology_term: PPEO:hasName
    - name: description
      codename: methodDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: reference
      codename: methodReference
      type: uri
      required: false
      description: Reference URL.
      ontology_term: PPEO:hasExternalIdentifier
  Observation:
    ontology_term: PPEO:observation
    description: A single observation/measurement.
    fields:
    - name: value
      codename: value
      type: string
      required: true
      description: Observed value.
      ontology_term: PPEO:hasValue
    - name: timestamp
      codename: timestamp
      type: datetime
      required: false
      description: Observation timestamp.
      ontology_term: PPEO:hasDateTime
    - name: variable
      codename: variable
      type: entity
      items: ObservedVariable
      required: true
      description: The observed variable.
      ontology_term: PPEO:hasVariable
    - name: observation_unit
      codename: observationUnit
      type: entity
      items: ObservationUnit
      required: false
      description: The observation unit observed.
      ontology_term: PPEO:hasObservedSubject
    - name: sample
      codename: sample
      type: entity
      items: Sample
      required: false
      description: The sample observed.
      ontology_term: PPEO:hasObservedSubject
  ObservationLevel:
    ontology_term: PPEO:observation_level
    description: A level in the observation hierarchy.
    fields:
    - name: name
      codename: levelName
      type: string
      required: true
      description: Level name.
      ontology_term: PPEO:hasName
    - name: superlevel
      codename: superlevel
      type: entity
      items: ObservationLevel
      required: false
      description: Parent level.
      ontology_term: PPEO:hasSuperlevel
    - name: sublevel
      codename: sublevel
      type: entity
      items: ObservationLevel
      required: false
      description: Child level.
      ontology_term: PPEO:hasSublevel
    - name: hierarchy
      codename: hierarchy
      type: entity
      items: ObservationLevelHierarchy
      required: false
      description: Parent hierarchy.
      ontology_term: PPEO:partOf
  ObservationLevelHierarchy:
    ontology_term: PPEO:observation_level_hierarchy
    description: A hierarchy of observation levels.
    fields:
    - name: name
      codename: hierarchyName
      type: string
      required: false
      description: Hierarchy name.
      ontology_term: PPEO:hasName
    - name: levels
      codename: levels
      type: list
      items: ObservationLevel
      required: false
      description: Levels in this hierarchy.
      ontology_term: PPEO:hasPart
  ObservationUnit:
    ontology_term: PPEO:observation_unit
    description: An observation unit.
    fields:
    - name: name
      codename: observationUnitName
      type: string
      required: true
      description: Name.
      ontology_term: PPEO:hasName
    - name: type
      codename: observationUnitType
      type: string
      required: false
      description: Type (plot, plant, etc.).
      ontology_term: PPEO:hasType
    - name: study
      codename: study
      type: entity
      items: Study
      required: false
      description: Parent study.
      ontology_term: PPEO:partOf
    - name: biological_material
      codename: biologicalMaterial
      type: entity
      items: BiologicalMaterial
      required: false
      description: Biological material.
      ontology_term: PPEO:hasBiologicalMaterial
    - name: observation_level
      codename: observationLevel
      type: entity
      items: ObservationLevel
      required: false
      description: Observation level.
      ontology_term: PPEO:hasObservationLevel
    - name: spatial_distribution
      codename: spatialDistribution
      type: entity
      items: SpatialDistribution
      required: false
      description: Spatial distribution.
      ontology_term: PPEO:hasSpatialDistribution
    - name: factor_values
      codename: factorValues
      type: list
      items: FactorValue
      required: false
      description: Factor values applied.
      ontology_term: PPEO:hasFactorValue
    - name: events
      codename: events
      type: list
      items: Event
      required: false
      description: Events affecting this unit.
      ontology_term: PPEO:hasEvent
    - name: observations
      codename: observations
      type: list
      items: Observation
      required: false
      description: Observations on this unit.
      ontology_term: PPEO:isSubjectOfObservation
  ObservedVariable:
    ontology_term: PPEO:observed_variable
    description: A variable being observed.
    fields:
    - name: name
      codename: observedVariableName
      type: string
      required: true
      description: Variable name.
      ontology_term: PPEO:hasName
    - name: description
      codename: observedVariableDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: study
      codename: study
      type: entity
      items: Study
      required: false
      description: Parent study.
      ontology_term: PPEO:partOf
    - name: trait
      codename: trait
      type: entity
      items: Trait
      required: false
      description: The trait.
      ontology_term: PPEO:hasTrait
    - name: method
      codename: method
      type: entity
      items: Method
      required: false
      description: The method.
      ontology_term: PPEO:hasMethod
    - name: scale
      codename: scale
      type: entity
      items: Scale
      required: false
      description: The scale.
      ontology_term: PPEO:hasScale
  Person:
    ontology_term: PPEO:person
    description: A person.
    fields:
    - name: name
      codename: personName
      type: string
      required: true
      description: Person name.
      ontology_term: PPEO:hasName
    - name: email
      codename: email
      type: string
      required: false
      description: Email.
      ontology_term: PPEO:hasEmailContact
    - name: affiliation
      codename: affiliation
      type: entity
      items: Institution
      required: false
      description: Affiliation.
      ontology_term: PPEO:hasAffiliation
    - name: roles
      codename: roles
      type: list
      items: Role
      required: false
      description: Roles.
      ontology_term: PPEO:hasRole
  Role:
    ontology_term: PPEO:role
    description: A role played by a person.
    fields:
    - name: name
      codename: roleName
      type: string
      required: true
      description: Role name.
      ontology_term: PPEO:hasName
    - name: person
      codename: person
      type: entity
      items: Person
      required: false
      description: The person.
      ontology_term: PPEO:isRoleOf
    - name: investigation
      codename: investigation
      type: entity
      items: Investigation
      required: false
      description: Investigation this role is in.
      ontology_term: PPEO:isRoleOfPersonIn
    - name: study
      codename: study
      type: entity
      items: Study
      required: false
      description: Study this role is in.
      ontology_term: PPEO:isRoleOfPersonIn
  Sample:
    ontology_term: PPEO:sample
    description: A sample derived from an observation unit.
    fields:
    - name: name
      codename: sampleName
      type: string
      required: true
      description: Sample name.
      ontology_term: PPEO:hasName
    - name: description
      codename: sampleDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: collection_date
      codename: collectionDate
      type: datetime
      required: false
      description: Collection date.
      ontology_term: PPEO:hasCollectionDate
    - name: plant_anatomical_entity
      codename: plantAnatomicalEntity
      type: string
      required: false
      description: Plant part.
      ontology_term: PPEO:hasPlantAnatomicalEntity
    - name: plant_structural_development_stage
      codename: plantStructuralDevelopmentStage
      type: string
      required: false
      description: Development stage.
      ontology_term: PPEO:hasPlantStructureDevelopmentStage
    - name: observation_unit
      codename: observationUnit
      type: entity
      items: ObservationUnit
      required: false
      description: Source observation unit.
      ontology_term: PPEO:derivesFrom
    - name: observations
      codename: observations
      type: list
      items: Observation
      required: false
      description: Observations on this sample.
      ontology_term: PPEO:isSubjectOfObservation
  Scale:
    ontology_term: PPEO:scale
    description: A measurement scale.
    fields:
    - name: name
      codename: scaleName
      type: string
      required: true
      description: Scale name.
      ontology_term: PPEO:hasName
    - name: description
      codename: scaleDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: type
      codename: scaleType
      type: string
      required: false
      description: Scale type.
      ontology_term: PPEO:hasType
  SpatialDistribution:
    ontology_term: PPEO:spatial_distribution
    description: Spatial distribution of an observation unit.
    fields:
    - name: description
      codename: spatialDistributionDescription
      type: string
      required: false
      description: Description.
      ontology_term: PPEO:hasDescription
    - name: type
      codename: spatialDistributionType
      type: entity
      items: SpatialDistributionType
      required: false
      description: Distribution type.
      ontology_term: PPEO:hasSpatialDistributionType
    - name: x
      codename: x
      type: string
      required: false
      description: X coordinate.
      ontology_term: PPEO:x
    - name: y
      codename: y
      type: string
      required: false
      description: Y coordinate.
      ontology_term: PPEO:y
    - name: z
      codename: z
      type: string
      required: false
      description: Z coordinate.
